---
name: Validate YAML

on:
  push:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'tests/**'
      - 'notes/packaging-lab-provenance.md'
      - 'notes/field-conventions-validation.md'
      - 'tools/validate_spec.py'
      - 'tools/generate_docs.py'
      - 'notes/handling-history-docs.md'
      - 'notes/nutrient-reporting-consistency.md'
      - 'docs/**'
      - 'requirements-docs.txt'
      - 'releases/**'
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'tests/**'
      - 'notes/packaging-lab-provenance.md'
      - 'notes/field-conventions-validation.md'
      - 'tools/validate_spec.py'
      - 'tools/generate_docs.py'
      - 'notes/handling-history-docs.md'
      - 'notes/nutrient-reporting-consistency.md'
      - 'docs/**'
      - 'requirements-docs.txt'
      - 'releases/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependencies
        run: pip install yamllint -r requirements-docs.txt

      - name: Run yamllint
        run: yamllint -c .yamllint .

      - name: Check packaging and provenance contracts
        run: python -m unittest discover -s tests -v

      - name: Validate specification conventions
        run: python tools/validate_spec.py src/hay-spec.yaml --baseline tests/legacy-spec-warnings.json

      - name: Verify generated documentation
        run: python tools/generate_docs.py --check

      - name: Build reference site
        run: mkdocs build --strict
