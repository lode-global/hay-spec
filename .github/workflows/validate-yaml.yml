---
name: Validate YAML

on:
  push:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'tests/**'
      - 'notes/packaging-lab-provenance.md'
      - 'notes/field-conventions-validation.md'
      - 'tools/validate_spec.py'
      - 'tools/generate_docs.py'
      - 'tools/field_guides.py'
      - 'tools/templates/**'
      - 'overrides/**'
      - 'notes/unified-documentation.md'
      - 'notes/single-reading-experience.md'
      - 'notes/reference-data-policy.md'
      - 'notes/source-field-completeness.md'
      - 'notes/legacy-storage-enums.md'
      - 'notes/legacy-identifier-interoperability.md'
      - 'examples/**'
      - 'notes/traceability-field-guide.md'
      - 'notes/nutrient-field-guide.md'
      - 'notes/all-section-field-guides.md'
      - 'notes/version-history-reconciliation.md'
      - 'notes/archive/**'
      - 'notes/handling-history-docs.md'
      - 'notes/nutrient-reporting-consistency.md'
      - 'notes/reference-display.md'
      - 'notes/source-field-provenance.md'
      - 'docs/**'
      - 'requirements-docs.txt'
      - 'releases/**'
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'tests/**'
      - 'notes/packaging-lab-provenance.md'
      - 'notes/field-conventions-validation.md'
      - 'tools/validate_spec.py'
      - 'tools/generate_docs.py'
      - 'tools/field_guides.py'
      - 'tools/templates/**'
      - 'overrides/**'
      - 'notes/unified-documentation.md'
      - 'notes/single-reading-experience.md'
      - 'notes/reference-data-policy.md'
      - 'notes/source-field-completeness.md'
      - 'notes/legacy-storage-enums.md'
      - 'notes/legacy-identifier-interoperability.md'
      - 'examples/**'
      - 'notes/traceability-field-guide.md'
      - 'notes/nutrient-field-guide.md'
      - 'notes/all-section-field-guides.md'
      - 'notes/version-history-reconciliation.md'
      - 'notes/archive/**'
      - 'notes/handling-history-docs.md'
      - 'notes/nutrient-reporting-consistency.md'
      - 'notes/reference-display.md'
      - 'notes/source-field-provenance.md'
      - 'docs/**'
      - 'requirements-docs.txt'
      - 'releases/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependencies
        run: pip install yamllint -r requirements-docs.txt

      - name: Run yamllint
        run: yamllint -c .yamllint .

      - name: Check packaging and provenance contracts
        run: python -m unittest discover -s tests -v

      - name: Validate specification conventions
        run: python tools/validate_spec.py src/hay-spec.yaml --baseline tests/legacy-spec-warnings.json

      - name: Verify generated documentation
        run: python tools/generate_docs.py --check

      - name: Build reference site
        run: mkdocs build --strict
