      - id: protein_fractions
        title: Protein and Nitrogen Fractions
        data_type: group
        section: nutrient_analysis
        required: false
        narration: >
          This group provides a detailed profile of forage protein quality and availability. It includes total crude protein and subdivides it into fractions representing soluble,
          degradable, and indigestible components. These values are essential for balancing rations based on rumen degradability and metabolizable protein supply.

          Understanding these fractions helps nutritionists formulate diets that match animal requirements, minimize waste, and improve feed efficiency, particularly in high-performance
