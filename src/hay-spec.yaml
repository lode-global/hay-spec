  - id: nutrient_analysis
    title: Nutrient Analysis
    data_type: section
    required: true
    narration: >
      This section captures laboratory test results and related metadata for the hay's nutritional profile. These metrics help buyers evaluate forage quality and suitability for
      various animal classes.

      When available, forage analysis results supplement visual observations and support data-driven ration formulation. Fields cover whether the hay was tested, how the sample was
      processed, and selected analytical values.
    definition: >
      Contains results from laboratory analysis of forage nutrient content, including protein, fiber, minerals, digestibility, and energy metrics. Used to evaluate feeding value and
      compliance with nutritional targets.
    validation_guidance: >
      - Certain laboratory results may return the special value `trace`, indicating that an analyte was detected but not present at a reliably quantifiable concentration.
      - `trace` is permitted only for specific fields, such as `chloride_ion`, and must be explicitly listed in that fields valid values.
      - Use `trace` to distinguish between non-detection and sub-threshold detection; do not substitute `0.00`.
      - Numeric values, when used, should reflect results above the detection threshold and typically include up to two decimal places.
      - This approach supports clarity in interpreting low-level results without compromising numeric integrity in other fields.
    numeric_id: 132
    groups:
      - id: lab_processing
        fields:
          - id: hay_tested
            title: Hay Tested
            data_type: enum
            section: nutrient_analysis
            group: lab_processing
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              This field confirms whether analytical testing was performed on a sample from the hay lot. Use `true` if lab testing occurred, `false` if no testing was done, and `unknown` if
              the status is uncertain. This field provides critical context for interpreting downstream lab analysis values and overall lot characterization.
            definition: >
              Indicates whether a laboratory test was performed on a sample from this hay lot.
            validation_guidance: >
              Must be one of: `true`, `false`, or `unknown`.
            numeric_id: 134
          - id: hay_sample_date
            title: Hay Sample Date
            data_type: date
            section: nutrient_analysis
            group: lab_processing
            required: false
            narration: >
              Records the date on which the hay sample was collected for laboratory analysis. Accurate sample dating is important for interpreting results in the context of hay storage time,
              nutrient degradation, and marketing timelines.

              Some laboratories require the sample date for regulatory or archival purposes.
            definition: >
              Date when the hay sample was collected for laboratory testing.
            validation_guidance: >
              - Must be formatted as `YYYYMMDD`.
              - Use `YYYYMM00` if day is unknown.
              - Use `YYYY0000` if both month and day are unknown.
              - Use `00000000` if no date is available or applicable.
            cross_field_consistency: >
              The value for `hay_sample_date}} should not precede that for [[harvest_date_end` (if known), and should reflect the hay lot offered for sale.
            numeric_id: 135
          - id: hay_sampler_independent
            title: Hay Sampler Independent
            data_type: enum
            section: nutrient_analysis
            group: lab_processing
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              A value of `true` indicates the sample was taken by a third party -- such as a certified lab technician, consultant, or extension agent -- with no financial interest in the hay
              sale.

              A value of `false` means the sample was collected by the seller or someone affiliated with the seller.

              Use `unknown` when the sampler's identity or affiliation is not known. This distinction can influence buyer confidence in the impartiality of lab results, especially in
              regulated feed programs or high-value transactions.
            definition: >
              Indicates whether the individual or entity that collected the hay sample was independent of the seller.
            validation_guidance: >
              Must be one of: `true`, `false`, or `unknown`.
            numeric_id: 136
          - id: hay_sampler_certified
            title: Hay Sampler Certified
            data_type: enum
            section: nutrient_analysis
            group: lab_processing
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              A value of `true` means the sampler held a recognized certification or had formal training in standardized forage sampling procedures -- such as using a coring probe and
              collecting samples from multiple bales.

              A value of `false` indicates the sample was collected by someone without documented training or certification.

              Use `unknown` if the samplers qualifications are not known. Certification status can influence confidence in the samples quality and the reliability of lab results,
              particularly in regulated or quality-assured programs.
            definition: >
              Indicates whether the person who collected the hay sample was certified or formally trained in forage sampling techniques.
            validation_guidance: >
              Must be one of: `true`, `false`, or `unknown`.
            numeric_id: 137
          - id: hay_sampling_protocol
            title: Hay Sampling Protocol
            data_type: string
            section: nutrient_analysis
            group: lab_processing
            required: true
            enum_select_mode: single
            narration: >
              This field records the sampling methodology used to obtain a laboratory sample from the hay lot.

              Protocols may include formal guidelines -- such as those from the National Forage Testing Association (NFTA), university extension services, or industry associations -- or may
              describe informal practices used by the sampler.

              Proper sampling is essential to ensure a representative sample. For example, using a coring probe on 20 randomly selected bales yields more reliable results than a grab sample
              from a single bale. Clear documentation of the sampling method enhances transparency and supports accurate interpretation of test results.
            definition: >
              Describes the procedure or standard followed when collecting the hay sample for laboratory testing.
            validation_guidance: >
              Free-text field. Recommended maximum length: 250 characters. Should identify the protocol name, standard reference, or describe the method used (e.g., "NFTA guidelines,"
              "20-core composite," "grab sample from outer flakes").
            numeric_id: 138
          - id: hay_testing_laboratory
            title: Hay Testing Laboratory
            data_type: string
            section: nutrient_analysis
            group: lab_processing
            required: false
            valid_values_reference: "`forage_testing_laboratories`"
            valid_values_additional: "`internal_lab`"
            narration: >
              This field specifies the laboratory that conducted the forage analysis. Using a standardized reference list of certified forage testing labs promotes consistency and
              traceability. Many listed labs participate in proficiency programs such as the National Forage Testing Association (NFTA) or equivalent international standards.

              If the analysis was performed using in-house or on-farm equipment, the value "Internal lab" should be used. In these cases, sellers are encouraged to provide supporting
              documentation of their testing procedures and equipment calibration.
            definition: >
              Identifies the laboratory responsible for conducting the forage analysis.
            validation_guidance: >
              Should match a value from the reference list `forage_testing_laboratories`or use the additional value "Internal lab" for in-house testing.
            numeric_id: 139
          - id: hay_testing_method
            title: Hay Testing Method
            data_type: enum
            section: nutrient_analysis
            group: lab_processing
            required: false
            required_if:
              field: hay_tested
              operator: value_present
              value: true
            enum_select_mode: single
            valid_values:
              - "`chemical_analysis`"
              - "`nir_spectroscopy`"
              - "`both_chemical_analysis_and_nir`"
            narration: >
              This field provides context for interpreting the reliability and precision of reported forage values.

              - `chemical_analysis`: Traditional wet chemistry methods. These are highly accurate and are used to calibrate other methods.
              - `nir_spectroscopy`: Near-infrared reflectance spectroscopy (NIR), a rapid and cost-effective method that compares spectral profiles to a calibrated database. Accuracy depends
              on forage type and calibration quality.
              - `both_chemical_analysis_and_nir`: Indicates that both methods were applied to the same sample, either for validation or to leverage the strengths of each.

              Understanding the test method is essential for comparing results across samples and for determining whether the data are suitable for ration formulation or regulatory
              compliance.
            definition: >
              Identifies the analytical method used to evaluate the hay sample.
            validation_guidance: >
              - Required if `hay_tested` is `true`.
              - Must be one of: `chemical_analysis`, `nir_spectroscopy`, or `both_chemical_analysis_and_nir`.
            numeric_id: 140
          - id: hay_testing_date
            title: Hay Testing Date
            data_type: date
            section: nutrient_analysis
            group: lab_processing
            required: false
            required_if:
              field: hay_tested
              operator: value_present
              value: true
            narration: >
              This field captures the date the hay sample was analyzed by the laboratory.

              Knowing the testing date helps verify sample freshness, confirm turnaround time from collection to analysis, and evaluate how results correspond to hay condition over time.

              In some contexts, this field may also serve regulatory or traceability requirements, especially if results are used for certification, export, or feed safety documentation.
            definition: >
              Records the date on which the hay sample was tested in the laboratory.
            validation_guidance: >
              - Required if `hay_tested` is `true`.
              - Must be formatted as `YYYYMMDD`.
              - A full date is required.
              - Partial or unknown values are not permitted for this field.
              - Must be a valid ISO 8601 date.
            numeric_id: 141
          - id: lab_sample_id
            title: Lab Sample ID
            data_type: string
            section: nutrient_analysis
            group: lab_processing
            required: false
            required_if:
              field: hay_tested
              operator: value_present
              value: true
            narration: >
              This field stores the unique identifier used by the lab to track the submitted hay sample. It facilitates communication with the lab, retrieval of results, and verification of
              the original report.
            definition: >
              Records the sample identifier assigned by the laboratory.
            validation_guidance: >
              - Required if `hay_tested` is `true`.
              - Free-text field. Recommended maximum length: 100 characters.
            numeric_id: 142
          - id: lab_report_reference
            title: Lab Report Reference
            data_type: string
            section: nutrient_analysis
            group: lab_processing
            required: false
            narration: >
              Use this field to reference the original laboratory report associated with the hay sample. This may include a PDF report ID, file name, or direct link to a document. It
              supports traceability and documentation for regulatory or commercial use.
            definition: >
              Stores a file name, report ID, or external link to the full lab report.
            validation_guidance: >
              Free-text field. Recommended maximum length: 250 characters. May include alphanumeric codes or a URL.
            numeric_id: 143
          - id: lab_processing_notes
            title: Lab Processing Notes
            data_type: string
            section: nutrient_analysis
            group: lab_processing
            required: false
            narration: >
              This field allows the laboratory or data manager to record any relevant observations during sample handling -- such as regrinding, moisture correction, irregular particle size,
              or unusual sample condition. These notes help explain unexpected results and support transparency in lab workflows.
            definition: >
              Captures lab-specific comments about how the sample was prepared or handled prior to analysis.
            validation_guidance: >
              Free-text field. Recommended maximum length: 250 characters.
            numeric_id: 144
          - id: lab_processing_completed_date
            title: Lab Processing Completed Date
            data_type: date
            section: nutrient_analysis
            group: lab_processing
            required: false
            narration: >
              This date marks when the lab finalized its processing of the sample and results became available. It may differ from the testing date in cases of batch delays, reruns, or
              extended digestion procedures.
            definition: >
              Records the date the laboratory completed processing and analysis of the hay sample.
            validation_guidance: >
              - Must be formatted as `YYYYMMDD`.
              - A full date is required.
              - Partial or unknown values are not permitted for this field.
              - Must be a valid ISO 8601 date.
            numeric_id: 145
          - id: lab_quality_code
            title: Lab Quality Code
            data_type: string
            section: nutrient_analysis
            group: lab_processing
            required: false
            narration: >
              Some laboratories assign quality flags or interpretation codes to clarify how results should be used. For example, a code might indicate that the sample was rerun, that results
              exceeded calibration bounds, or that the test is for screening purposes only. This field enables transparent data handling and user awareness of result confidence.
            definition: >
              Represents an internal or external lab-issued code qualifying the reliability or status of the analysis.
            validation_guidance: >
              Free-text field. Recommended maximum length: 100 characters.
            numeric_id: 146
      - id: base_nutrient_values
        fields:
          - id: moisture_content
            title: Moisture Content
            data_type: float
            section: nutrient_analysis
            group: base_nutrient_values
            required: false
            required_if:
              field: hay_tested
              operator: value_present
              value: true
            valid_range:
              min: 5
              max: 45
            narration: >
              Forage testing labs may measure moisture content directly or calculate it by subtracting dry matter from 100%. Moisture content is also used to convert other nutrient values
              between "as-fed" and "dry matter" basis. While this specification records moisture content explicitly, dry matter may be calculated separately when needed. A value of 100%
              would represent pure water and is not realistic in hay samples.
            definition: >
              The percentage of the sample's total weight that consists of water. Moisture content is the inverse of dry matter and plays a critical role in hay storage, preservation, and
              nutritional calculations.
            validation_guidance: >
              - Required if `hay_tested` is `true`.
              - Must be a positive decimal between 5.0 and 45.0.
              - Values above 18.0% may require preservative or special handling depending on bale size and storage conditions.
              - Typical moisture at baling ranges from 12-18% for dry hay, with lower targets for large square bales.
            numeric_id: 148
          - id: dry_matter
            title: Dry Matter
            data_type: float
            section: nutrient_analysis
            group: base_nutrient_values
            required: false
            required_if:
              field: hay_tested
              operator: value_present
              value: true
            valid_range:
              min: 55
              max: 95
            narration: >
              Dry matter includes all nutrients -- such as fiber, protein, minerals, and energy -- and is the standard basis for comparing feeds and formulating rations. Values below 85% may
              suggest elevated moisture and increased risk of spoilage or spontaneous heating. All nutrient values are typically reported on a dry matter basis to eliminate dilution effects
              from water and ensure comparability across feed types.
            definition: >
              A positive decimal value representing the dry matter content of the hay sample, expressed as a percentage. Dry matter is the portion of the forage that remains after all
              moisture has been removed.
            validation_guidance: >
              - Required if `hay_tested` is `true`.
              - Must be a positive decimal between 55.0 and 95.0.
              - Dry matter reflects the portion of forage that is not water. Most dry hay falls between 82-90% DM. High-moisture forage (e.g., baleage) may test as low as 55%, corresponding
              to 45% moisture.
            numeric_id: 149
      - id: forage_quality_indexes
        fields:
          - id: relative_feed_value
            title: Relative Feed Value
            data_type: int
            section: nutrient_analysis
            group: forage_quality_indexes
            required: false
            valid_range:
              min: 50
              max: 250
            narration: >
              Relative Feed Value (RFV) is calculated using the formula: RFV equals Dry Matter Intake percent times Digestible Dry Matter percent divided by 1.29. The scale is normalized so
              that full-bloom alfalfa scores 100. Higher values suggest improved animal performance due to greater digestibility and intake potential. Example classifications include:
              greater than 150 is considered excellent; 125 to 150 is good; 103 to 124 is fair; 87 to 102 is poor; less than 87 is reject or very low quality. RFV does not account for fiber
              digestibility differences among forages and is being replaced in many contexts by Relative Forage Quality (RFQ), which provides a more accurate assessment.
            definition: >
              A positive decimal value representing the Relative Feed Value (RFV) of the hay sample. RFV is a standardized index used to estimate overall forage quality based on
              digestibility and potential intake, calculated from ADF and NDF values.
            validation_guidance: >
              - Must be a positive decimal between 50.0 and 250.0.
              - Relative Feed Value (RFV) is a dimensionless index used to evaluate forage quality based on ADF and NDF. Most hay falls between 100 and 180. Values above 185 indicate very
              high-quality dairy forage.
            numeric_id: 151
          - id: relative_forage_quality
            title: Relative Forage Quality
            data_type: int
            section: nutrient_analysis
            group: forage_quality_indexes
            required: false
            valid_range:
              min: 50
              max: 300
            narration: >
              Relative Forage Quality (RFQ) improves upon Relative Feed Value (RFV) by using Total Digestible Nutrients (TDN) instead of Acid Detergent Fiber (ADF) and by incorporating
              Neutral Detergent Fiber Digestibility (NDFD), when available. It is calculated using a formula such as RFQ equals Dry Matter Intake percent times Total Digestible Nutrients
              percent divided by 1.23. Dry Matter Intake is based on NDF, and TDN is based on ADF and NDFD. RFQ provides a more accurate assessment of feeding value, particularly for
              grasses, mixed forages, and forages with high fiber digestibility. Like RFV, it is scaled so that full-bloom alfalfa scores 100. Example classifications include: greater than
              170 is prime; 150 to 170 is premium; 130 to 149 is good; 100 to 129 is fair; and less than 100 is low quality. RFQ is now the preferred index in many extension and laboratory
              reports, especially when NDFD is measured or predicted.
            definition: >
              A positive decimal value representing the Relative Forage Quality (RFQ) of the hay sample. RFQ is an enhanced forage index that estimates overall feed value by incorporating
              both potential intake and fiber digestibility.
            validation_guidance: >
              - Must be a positive decimal between 50.0 and 300.0.
              - Relative Forage Quality (RFQ) improves on RFV by incorporating digestible fiber and is considered more accurate for grass and mixed forages. Most hay falls between 100 and
              200.
            numeric_id: 152
      - id: nrc2001_energy
        fields:
          - id: digestible_energy_1x_mcal_per_lb
            title: Digestible Energy 1X Mcal Per Lb
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.75
              max: 1.45
            narration: >
              Digestible Energy (DE) is calculated as the gross energy of the forage minus fecal energy losses. It is an intermediate measure used before metabolizable and net energy
              estimates. This value is expressed in megacalories per pound of feed on a dry matter basis. The 1X designation refers to maintenance-level intake, meaning it does not account
              for energy demands from lactation, growth, or work. Higher DE values indicate better digestibility and energy availability. DE is used in ration formulation for animals such as
              horses, beef cattle, and sheep.
            definition: >
              A positive decimal value representing the Digestible Energy (DE) of the hay sample in megacalories per pound (Mcal/lb), calculated at maintenance-level intake (1X).
            validation_guidance: >
              - Must be a decimal between 0.75 and 1.45.
              - Digestible energy at maintenance (DE_1x) represents the energy available from the forage assuming intake at 1x maintenance level. Most hay falls between 1.00 and 1.35
              Mcal/lb, with values below 0.90 typical of straw or poor-quality hay.
            numeric_id: 154
          - id: metabolizable_energy_1x_mcal_per_lb
            title: Metabolizable Energy 1X Mcal Per Lb
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.6
              max: 1.35
            narration: >
              Metabolizable Energy (ME) is calculated as Digestible Energy (DE) minus energy lost as gases, primarily methane, and in urine. It represents the portion of energy available for
              maintenance and productive functions in the animal. The 1X label refers to maintenance-level intake, meaning this energy value does not include adjustments for added metabolic
              demand such as lactation or growth. ME is typically expressed in megacalories per pound on a dry matter basis and is commonly used in ration formulation for ruminants and
              equines. It also serves as the basis for calculating net energy values.
            definition: >
              A positive decimal value representing the Metabolizable Energy (ME) of the hay sample in megacalories per pound (Mcal/lb), calculated at maintenance-level intake (1X).
            validation_guidance: >
              - Must be a decimal between 0.60 and 1.35.
              - Metabolizable energy at maintenance (ME_1x) accounts for urinary and gaseous energy losses. Most hay falls between 0.90 and 1.20 Mcal/lb. Values above 1.30 are rare and
              usually reflect highly digestible forage or misreported data.
            numeric_id: 155
          - id: net_energy_lactation_3x_mcal_per_lb
            title: Net Energy Lactation 3X Mcal Per Lb
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.35
              max: 0.85
            narration: >
              Net Energy of Lactation (NEL) estimates the portion of energy in forage available for milk production after subtracting all energy losses, including those from feces, urine,
              gases, and heat increment. The 3X designation refers to dry matter intake at three times the maintenance energy requirement, which reflects typical consumption patterns in
              lactating dairy cows. This standardization improves the comparability of NEL values across forages. NEL is expressed in megacalories per pound on a dry matter basis and is
              widely used in dairy ration formulation to estimate energy supply and milk yield potential.
            definition: >
              A positive decimal value representing the Net Energy of Lactation (NEL) of the hay sample in megacalories per pound (Mcal/lb), adjusted for intake at three times maintenance
              level (3X).
            validation_guidance: >
              - Must be a decimal between 0.35 and 0.85.
              - Net Energy for Lactation at 3x intake (NEL_3x) estimates energy available for milk production. Most grass hay ranges from 0.50-0.65 Mcal/lb, while top alfalfa may reach 0.80
              Mcal/lb. Values above 0.82 are uncommon in dry forages.
            numeric_id: 156
          - id: net_energy_maintenance_3x_mcal_per_lb
            title: Net Energy Maintenance 3X Mcal Per Lb
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.35
              max: 0.9
            narration: >
              Net Energy of Maintenance (NEM) quantifies the portion of forage energy available to meet an animal's basic metabolic functions such as respiration, circulation, and
              temperature regulation. The 3X label indicates energy availability at an intake level three times higher than basic maintenance requirements, aligning with standardized feeding
              models for comparability. NEM is used primarily in beef cattle and sheep ration formulation to estimate whether the forage provides adequate baseline energy supply. It is
              expressed in megacalories per pound on a dry matter basis.
            definition: >
              A positive decimal value representing the Net Energy of Maintenance (NEM) of the hay sample in megacalories per pound (Mcal/lb), adjusted for intake at three times maintenance
              level (3X).
            validation_guidance: >
              - Must be a decimal between 0.35 and 0.90.
              - Net Energy for Maintenance at 3x intake (NEM_3x) reflects energy available to support baseline bodily function in livestock. Most hay falls between 0.55-0.75 Mcal/lb. Straw
              and damaged forages may test below 0.50. Values above 0.85 are rare.
            numeric_id: 157
          - id: net_energy_gain_3x_mcal_per_lb
            title: Net Energy Gain 3X Mcal Per Lb
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.2
              max: 0.8
            narration: >
              Net Energy of Gain (NEG) estimates the portion of energy in forage that is available for body weight gain after meeting maintenance energy needs. It accounts for energy lost as
              feces, urine, gases, heat, and maintenance metabolism. The 3x designation standardizes intake to three times maintenance level, reflecting expected consumption in growing beef
              cattle and optimizing comparability across forages. NEG is a critical value in formulating rations for weight gain and finishing programs. It is expressed in megacalories per
              pound on a dry matter basis.
            definition: >
              A positive decimal value representing the Net Energy of Gain (NEG) of the hay sample in megacalories per pound (Mcal/lb), adjusted for intake at three times maintenance level
              (3X).
            validation_guidance: >
              - Must be a decimal between 0.20 and 0.80.
              - Net Energy for Gain at 3x intake (NEG_3x) estimates the energy available for weight gain. Most hay falls between 0.45-0.70 Mcal/lb. Values below 0.30 are typical of crop
              residue or straw. Values above 0.78 are rare in dry forages.
            numeric_id: 158
          - id: digestible_energy_1x_mcal_per_kg
            title: Digestible Energy 1X Mcal Per Kg
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 1.65
              max: 3.2
            narration: >
              Digestible Energy (DE) measures the energy available in forage after subtracting fecal energy losses from gross energy content. The 1X designation indicates the estimate is
              based on intake equivalent to one times the maintenance energy requirement, consistent with NRC standards. This field expresses DE in megacalories per kilogram to support
              metric-based and international ration formulation. While U.S. systems commonly use Mcal/lb, Mcal/kg values are standard in global livestock nutrition.
            definition: >
              A positive decimal value representing the Digestible Energy (DE) of the hay sample in megacalories per kilogram (Mcal/kg), calculated at maintenance-level intake (1X).
            validation_guidance: >
              - Must be a decimal between 1.65 and 3.20.
              - Digestible energy at maintenance (DE_1x) represents the energy available from the forage when fed at maintenance intake level. This metric form is expressed in megacalories
              per kilogram of dry matter. Most hay falls between 2.0 and 2.9 Mcal/kg.
            numeric_id: 159
          - id: metabolizable_energy_1x_mcal_per_kg
            title: Metabolizable Energy 1X Mcal Per Kg
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 1.3
              max: 3
            narration: >
              Metabolizable Energy (ME) represents the amount of energy available to the animal after subtracting fecal, urinary, and gaseous losses from the Digestible Energy (DE) of the
              forage. This value is expressed in megacalories per kilogram to support metric-based feeding systems. The 1X designation reflects intake at maintenance energy levels, in line
              with assumptions used in NRC 2001 models for ruminants. Most hays provide between 1.6 and 2.3 Mcal/kg of ME on a dry matter basis. This value is essential for comparing forage
              sources in international and metric ration formulation contexts.
            definition: >
              A positive decimal value representing the Metabolizable Energy (ME) of the hay sample in megacalories per kilogram (Mcal/kg), calculated at maintenance-level intake (1X).
            validation_guidance: >
              - Must be a decimal between 1.30 and 3.00.
              - Metabolizable energy at maintenance (ME_1x) represents the portion of digestible energy retained after urinary and gas losses. This metric version is expressed per kilogram
              of dry matter. Most hay falls between 2.0 and 2.8 Mcal/kg.
            numeric_id: 160
          - id: net_energy_lactation_3x_mcal_per_kg
            title: Net Energy Lactation 3X Mcal Per Kg
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.75
              max: 1.9
            narration: >
              Net Energy for Lactation (NEL) represents the energy available from forage for milk production, after subtracting all losses from feces, urine, gas, and heat increment. This
              field expresses that value in megacalories per kilogram to support metric-based feed systems. The 3X label reflects a standardized dry matter intake level equivalent to three
              times maintenance, as used in NRC 2001 energy modeling. This intake assumption supports comparability across forages and feeding programs. Most hays fall between 1.3 and 1.8
              Mcal/kg NEL on a dry matter basis. Higher values indicate greater energy density and are typically associated with earlier-cut or legume-rich forages appropriate for lactating
              animals.
            definition: >
              A positive decimal value representing the Net Energy of Lactation (NEL) of the hay sample in megacalories per kilogram (Mcal/kg), assuming dry matter intake at three times
              maintenance level (3X).
            validation_guidance: >
              - Must be a decimal between 0.75 and 1.90.
              - Net Energy for Lactation at 3x intake (NEL_3x) reflects the portion of feed energy used for milk production. This metric version is expressed in Mcal per kilogram of dry
              matter. Most hay ranges from 1.0 to 1.7 Mcal/kg, with high-end alfalfa approaching 1.85.
            numeric_id: 161
          - id: net_energy_maintenance_3x_mcal_per_kg
            title: Net Energy Maintenance 3X Mcal Per Kg
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.75
              max: 2
            narration: >
              Net Energy for Maintenance (NEM) is the portion of forage energy available to sustain essential functions such as thermoregulation, circulation, and tissue maintenance. It is a
              foundational energy metric used in both beef and dairy nutrition models. The 3X designation reflects an assumed intake level at three times the maintenance requirement,
              following NRC 2001 energy modeling conventions. This field expresses NEM in megacalories per kilogram to support metric-based and international nutrition systems. Forage
              samples typically range from 1.1 to 1.6 Mcal/kg NEM. Higher values indicate better energy efficiency for livestock maintenance needs and are often observed in early-cut or
              legume-rich forages.
            definition: >
              A positive decimal value representing the Net Energy for Maintenance (NEM) of the hay sample in megacalories per kilogram (Mcal/kg), assuming dry matter intake at three times
              maintenance level (3X).
            validation_guidance: >
              - Must be a decimal between 0.75 and 2.00.
              - Net Energy for Maintenance at 3x intake (NEM_3x) reflects the energy required for basic body function. Expressed per kilogram of dry matter. Most dry hay falls between 1.2
              and 1.7 Mcal/kg, with values above 1.9 being rare.
            numeric_id: 162
          - id: net_energy_gain_3x_mcal_per_kg
            title: Net Energy Gain 3X Mcal Per Kg
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 0.4
              max: 1.8
            narration: >
              Net Energy for Gain (NEG) estimates the portion of forage energy available for body weight gain, including both muscle and fat deposition, after maintenance energy needs have
              been met. This value is reported in megacalories per kilogram on a dry matter basis to support metric-based feeding systems. The 3x designation follows NRC 2001 modeling
              standards, assuming dry matter intake at three times the maintenance requirement. Most forages range between 0.55 and 1.3 Mcal/kg NEG. Higher values reflect greater energy
              density and are associated with increased average daily gain (ADG) in growing or finishing livestock, especially beef cattle.
            definition: >
              A positive decimal value representing the Net Energy for Gain (NEG) of the hay sample in megacalories per kilogram (Mcal/kg), assuming dry matter intake at three times
              maintenance level (3X).
            validation_guidance: >
              - Must be a decimal between 0.40 and 1.80.
              - Net Energy for Gain at 3x intake (NEG_3x) estimates energy available for bodyweight gain. Most dry hay falls between 0.8 and 1.5 Mcal/kg. Lower values are typical of straw
              and stalks. Values above 1.75 are rare.
            numeric_id: 163
          - id: tdn_1x
            title: Tdn 1X
            data_type: float
            section: nutrient_analysis
            group: nrc2001_energy
            required: false
            valid_range:
              min: 40
              max: 75
            narration: >
              Total Digestible Nutrients (TDN) estimates the total amount of digestible fiber, protein, lipid, and carbohydrate in a forage. It is a key indicator of the forage's overall
              energy content. The 1x designation refers to an intake level equal to one times the animal's maintenance requirement, consistent with NRC 2001 modeling standards. TDN is
              expressed as a percentage of dry matter. Most hay samples fall between 50 and 70 percent TDN. Higher values suggest greater energy availability and typically result from
              earlier harvests and more digestible forage components.
            definition: >
              A positive decimal value representing the Total Digestible Nutrients (TDN) of the hay sample, expressed as a percentage of dry matter, at maintenance-level intake (1X).
            validation_guidance: >
              - Must be a decimal between 40.0 and 75.0.
              - Total Digestible Nutrients at 1x intake (TDN_1x) reflects the total energy-yielding portion of the forage. Most hay falls between 55-70% TDN. Values above 75% are rare and
              suggest very high digestibility or analytical anomalies.
            numeric_id: 164
      - id: protein_fractions
        fields:
          - id: crude_protein
            title: Crude Protein
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 3
              max: 28
            narration: >
              Crude Protein (CP) is an estimate of total protein content in forage, calculated by measuring nitrogen concentration and multiplying by a factor of 6.25. This total includes
              both true protein and non-protein nitrogen (NPN) compounds. Crude protein is expressed on a dry matter basis to remove dilution effects from moisture. Most grass hays contain
              between 6 and 12 percent CP, while legume hays such as alfalfa may reach 15 to 25 percent, depending on maturity and harvest conditions. CP is a standard parameter in livestock
              ration formulation and helps determine whether a forage meets protein requirements for different animal classes.
            definition: >
              A positive decimal value representing the Crude Protein (CP) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 3.0 and 28.0.
              - Crude protein (CP) reflects the total nitrogen content in forage and is a key indicator of nutritional value. Grass hay typically ranges from 6-12%, while high-quality
              alfalfa may reach 22-26%. Values above 28% are rare.
            numeric_id: 166
          - id: available_protein
            title: Available Protein
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 2
              max: 18
            narration: >
              Available protein is the portion of crude protein (CP) that remains digestible and usable by the animal after accounting for losses from heat damage, insolubility, and fiber-
              bound nitrogen. It provides a more accurate assessment of the true nutritional value of forage protein. Available protein is commonly estimated as crude protein minus acid
              detergent insoluble crude protein (ADF-CP). This field is especially important for assessing hay that may have been exposed to rain during harvest or damaged by overheating
              during storage, which can trigger Maillard reactions and reduce protein availability. Values are expressed on a dry matter basis. Legumes typically have higher available
              protein than grasses, and well-preserved hay retains a greater proportion of its CP as available protein.
            definition: >
              A positive decimal value representing the available protein content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 2.0 and 18.0.
              - Available protein represents the digestible and absorbable portion of the forage's crude protein. Grass hay typically provides 4-9%, while high-quality legumes may offer up
              to 17%. Values above 18% are rare and should be verified.
            numeric_id: 167
          - id: acid_detergent_insoluble_crude_protein
            title: Acid Detergent Insoluble Crude Protein
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 0
              max: 8
            narration: >
              Acid Detergent Insoluble Crude Protein (ADF-CP) is the fraction of crude protein that is bound to indigestible fiber and is generally considered unavailable to ruminants. This
              includes protein damaged by excessive heat during harvest or storage. ADF-CP is used in calculating available protein, where available protein equals crude protein minus ADF-
              CP. Higher ADF-CP values are associated with poorer forage quality. Values above 3.0 percent may indicate heat damage or poor harvest conditions, and such forages may
              underperform nutritionally even if crude protein content appears adequate.
            definition: >
              A positive decimal value representing the Acid Detergent Insoluble Crude Protein (ADF-CP) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.0 and 8.0.
              - Acid Detergent Insoluble Crude Protein (ADICP) represents the fraction of protein bound to indigestible fiber. Normal hay ranges from 0.5-2.0%. Higher values may indicate
              heat damage or excessive weathering.
            numeric_id: 168
          - id: adjusted_crude_protein
            title: Adjusted Crude Protein
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 3
              max: 26
            narration: >
              Adjusted Crude Protein (ACP) represents the forage's total protein content after accounting for indigestible fractions, such as heat-damaged or fiber-bound protein. It provides
              a more accurate estimate of protein available for animal use. ACP is typically calculated as crude protein minus acid detergent insoluble crude protein (ADF-CP), or other
              measures of unavailable protein. This field may conceptually overlap with available protein, depending on laboratory methodology or feed evaluation models. Including ACP in the
              data model ensures compatibility with lab reports that provide both values. ACP is expressed on a dry matter basis, and accurate representation is important when formulating
              diets, especially if hay has been weather-damaged or improperly cured.
            definition: >
              A positive decimal value representing the Adjusted Crude Protein (ACP) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 3.0 and 26.0.
              - Adjusted Crude Protein accounts for the indigestible protein fraction and provides a more accurate measure of usable protein. It is typically 1-3 points lower than total CP.
              Values above 26% are rare in hay.
            numeric_id: 169
          - id: soluble_protein_pct_cp
            title: Soluble Protein Percent Cp
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 15
              max: 75
            narration: >
              Soluble Protein is the fraction of crude protein that dissolves rapidly in rumen fluid and becomes quickly available for microbial fermentation. It includes non-protein
              nitrogen (NPN), peptides, amino acids, and some true protein. This field expresses soluble protein as a percentage of the total crude protein content. Typical values for hay
              range from 15 to 40 percent of CP. Higher values reflect faster ruminal degradation and may lead to nitrogen imbalances if not supported by sufficient fermentable energy.
              Soluble protein is an important component of degradable intake protein and is often used in formulating balanced rations to support optimal microbial protein synthesis in
              ruminants.
            definition: >
              A positive decimal value representing the soluble protein fraction of the hay sample, expressed as a percentage of crude protein (% of CP).
            validation_guidance: >
              - Must be a decimal between 15.0 and 75.0.
              - Soluble protein is the rapidly available fraction of crude protein. It plays a key role in microbial growth and rumen function. Most forages range from 30-60%. Values above
              70% are uncommon and may suggest high NPN or sampling error.
            numeric_id: 170
          - id: degradable_protein_pct_cp
            title: Degradable Protein Percent Cp
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 40
              max: 85
            narration: >
              Degradable Protein, also referred to as Ruminally Degradable Protein (RDP), is the portion of crude protein that is broken down in the rumen into ammonia, peptides, and amino
              acids. This fraction supports microbial protein synthesis and helps drive efficient fermentation. The value is expressed as a percentage of total crude protein and includes
              soluble protein as a subset, along with more slowly degradable true protein components. Forages generally contain 30 to 80 percent degradable protein relative to CP. When
              degradability is very high, diets may require supplementation with rumen undegradable protein (RUP) to ensure balanced nitrogen and energy availability.
            definition: >
              A positive decimal value representing the degradable crude protein content of the hay sample, expressed as a percentage of crude protein (% of CP).
            validation_guidance: >
              - Must be a decimal between 40.0 and 85.0.
              - Degradable protein represents the portion of total crude protein that is broken down in the rumen. Most grass hay ranges from 55-70%, and alfalfa from 65-80%. Values below
              40% may indicate heat damage or spoilage.
            numeric_id: 171
          - id: neutral_detergent_insoluble_crude_protein
            title: Neutral Detergent Insoluble Crude Protein
            data_type: float
            section: nutrient_analysis
            group: protein_fractions
            required: false
            valid_range:
              min: 0
              max: 4
            narration: >
              Neutral Detergent Insoluble Crude Protein (NDICP) is the fraction of crude protein that is insoluble in the neutral detergent solution used to determine fiber content (NDF). It
              is associated with the plant cell wall and may be partially or completely indigestible, depending on forage maturity, damage, or animal passage rate. NDICP is typically larger
              than ADF-CP because it includes both indigestible and potentially digestible fiber-bound protein. This metric helps estimate rumen undegradable protein (RUP) and metabolizable
              protein contributions in diet formulation. NDICP is expressed on a dry matter basis, and elevated values may signal overmature forage, excessive fiber content, or weather-
              related protein binding.
            definition: >
              A positive decimal value representing the Neutral Detergent Insoluble Crude Protein (NDICP) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.0 and 4.0.
              - Neutral Detergent Insoluble Crude Protein (NDICP) is the portion of total protein bound to fiber and typically resistant to digestion. Normal hay falls between 0.5-1.5%.
              Higher values may indicate heat damage or extended weathering.
            numeric_id: 172
      - id: amino_acid_profile
        fields:
          - id: lysine
            title: Lysine
            data_type: float
            section: nutrient_analysis
            group: amino_acid_profile
            required: false
            valid_range:
              min: 0.05
              max: 0.6
            narration: >
              Lysine is an essential amino acid required for growth, muscle development, and milk production. This field reports the lysine content of the hay sample on a dry matter basis.
              Values are typically determined through laboratory analysis and may vary depending on forage species, maturity, and preservation. Lysine may be measured directly through wet
              chemistry or estimated using Near Infrared Reflectance (NIR). Most hay samples contain between 0.3 and 1.5 percent lysine. Values outside this range may occur in unusual forage
              types or under atypical harvest conditions.
            definition: >
              A positive decimal value representing the lysine content of the forage sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.05 and 0.60.
              - Lysine is an essential amino acid and often the first limiting in livestock diets. Alfalfa hay typically ranges from 0.25-0.45% of dry matter. Values above 0.60% are uncommon
              and may suggest testing anomalies.
            numeric_id: 174
          - id: methionine
            title: Methionine
            data_type: float
            section: nutrient_analysis
            group: amino_acid_profile
            required: false
            valid_range:
              min: 0
              max: 0.45
            narration: >
              Methionine is an essential amino acid involved in protein synthesis and methylation processes. It is especially important in the nutrition of dairy animals and poultry. This
              field reports methionine content on a dry matter basis, typically determined through laboratory analysis using either Near Infrared Reflectance (NIR) or wet chemistry methods.
              Typical methionine levels in grass and legume hays range from 0.1 to 0.4 percent. Variation may occur depending on forage type, growth stage, and preservation quality.
            definition: >
              A positive decimal value representing the methionine content of the forage sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.00 and 0.45.
              - Methionine is an essential sulfur-containing amino acid and is often second-limiting in dairy and monogastric livestock diets.
              - Typical values range from 0.10 to 0.30 percent of dry matter.
              - Values above 0.45 percent are rare and may indicate testing anomalies or sample contamination.
            numeric_id: 175
      - id: carbohydrate_profile
        fields:
          - id: acid_detergent_fiber
            title: Acid Detergent Fiber
            data_type: float
            section: nutrient_analysis
            group: carbohydrate_profile
            required: false
            valid_range:
              min: 20
              max: 60
            narration: >
              Acid Detergent Fiber (ADF) is the portion of forage made up of cellulose and lignin, which are the least digestible structural components of plant cell walls. ADF is a key
              measure of forage quality because it is inversely related to digestibility -- higher ADF means lower digestibility. This value is expressed on a dry matter basis and is usually
              determined through laboratory analysis using either wet chemistry or Near Infrared Reflectance (NIR) techniques.
            definition: >
              A positive decimal value representing the Acid Detergent Fiber (ADF) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 20.0 and 60.0.
              - ADF reflects the cellulose and lignin content of forage and is inversely related to digestibility.
              - Typical values range from 25 to 45 percent of dry matter.
              - Values below 20 or above 60 percent are rare and may indicate sampling or analytical error.
            numeric_id: 177
          - id: neutral_detergent_fiber
            title: Neutral Detergent Fiber
            data_type: float
            section: nutrient_analysis
            group: carbohydrate_profile
            required: false
            valid_range:
              min: 30
              max: 75
            narration: >
              Neutral Detergent Fiber (NDF) quantifies the total cell wall content of forage, including hemicellulose, cellulose, and lignin. NDF is a key factor in determining forage bulk
              and is a primary constraint on dry matter intake in ruminants. Lower NDF values are generally associated with higher forage quality, greater palatability, and improved intake.
              This field expresses NDF on a dry matter basis and is typically measured using Near Infrared Reflectance (NIR) or wet chemistry laboratory methods.
            definition: >
              A positive decimal value representing the Neutral Detergent Fiber (NDF) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 30.0 and 75.0.
              - NDF measures the fibrous cell wall content and predicts forage intake.
              - Typical values range from 40 to 65 percent of dry matter depending on species and maturity.
              - Values below 30 or above 75 percent are uncommon and may reflect sampling error or highly unusual forage composition.
            numeric_id: 178
          - id: lignin
            title: Lignin
            data_type: float
            section: nutrient_analysis
            group: carbohydrate_profile
            required: false
            valid_range:
              min: 2
              max: 12
            narration: >
              Lignin is a complex, indigestible polymer present in the cell walls of plants. It plays a critical role in limiting forage digestibility. As lignin concentration increases, the
              digestibility of structural carbohydrates such as cellulose and hemicellulose declines. This field expresses lignin content on a dry matter basis and is typically measured via
              laboratory analysis. Lignin levels vary based on plant species, stage of maturity at harvest, and growing conditions.
            definition: >
              A positive decimal value representing the lignin content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 2.0 and 12.0.
              - Lignin is an indigestible fiber component that negatively affects forage digestibility.
              - Typical values range from 3.0 to 8.0 percent of dry matter depending on species and maturity.
              - Values below 2.0 or above 12.0 percent are uncommon and may indicate lab or sampling error.
            numeric_id: 179
          - id: non_fiber_carbohydrates
            title: Non Fiber Carbohydrates
            data_type: float
            section: nutrient_analysis
            group: carbohydrate_profile
            required: false
            valid_range:
              min: 10
              max: 45
            narration: >
              Non-Fiber Carbohydrates (NFC) represent the fraction of the forage made up of sugars, starches, pectins, and organic acids. These components are highly digestible and provide
              rapidly fermentable energy in ruminant diets. NFC is typically calculated using the formula: NFC = 100 minus the sum of NDF, crude protein (CP), fat, and ash. This value is
              expressed on a dry matter basis. Forages with high NFC content can support energy-dense rations but may also pose a risk of digestive upset if not balanced with adequate fiber.
              NFC is a key metric in evaluating the energy contribution of forage beyond fiber-based components.
            definition: >
              A positive decimal value representing the Non-Fiber Carbohydrate (NFC) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 10.0 and 45.0.
              - Non-fiber carbohydrates represent rapidly fermentable energy sources such as sugars and starches.
              - Typical values range from 15 to 35 percent of dry matter depending on species and maturity.
              - Values below 10 or above 45 percent are uncommon and may reflect calculation or sampling errors.
            numeric_id: 180
          - id: starch
            title: Starch
            data_type: float
            section: nutrient_analysis
            group: carbohydrate_profile
            required: false
            valid_range:
              min: 0
              max: 12
            narration: >
              Starch is a non-structural carbohydrate that significantly contributes to the energy density of forage. It is highly fermentable in the rumen and is commonly present in higher
              concentrations in small grain or mixed forages harvested at the boot or dough stage. Starch content is usually low in grass and legume hays. This value is expressed as a
              percentage of dry matter and is typically measured through laboratory analysis using either wet chemistry or Near Infrared Reflectance (NIR) methods.
            definition: >
              A positive decimal value representing the starch content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.0 and 12.0.
              - Starch is a non-structural carbohydrate contributing to energy density, especially in cereal forages or forages containing grain.
              - Typical values range from 0.5 to 6.0 percent of dry matter.
              - Values above 10.0 percent are uncommon in true hay and may indicate grain content or sample misclassification.
            numeric_id: 181
          - id: water_soluble_carbohydrates
            title: Water Soluble Carbohydrates
            data_type: float
            section: nutrient_analysis
            group: carbohydrate_profile
            required: false
            valid_range:
              min: 2
              max: 25
            narration: >
              Water Soluble Carbohydrates (WSC) include sugars and other rapidly fermentable carbohydrates that dissolve in water. WSC influences the palatability of forage and its
              fermentation behavior during ensiling. This value is expressed on a dry matter basis and is especially relevant for animals with dietary carbohydrate sensitivities, such as
              horses at risk for laminitis. WSC also plays a role in selecting forages suitable for high-energy diets or specific fermentation outcomes. It is typically measured through wet
              chemistry laboratory analysis.
            definition: >
              A positive decimal value representing the Water-Soluble Carbohydrate (WSC) content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 2.0 and 25.0.
              - Water-soluble carbohydrates include sugars and some fructans that contribute to palatability and rapid energy availability.
              - Typical values range from 6 to 18 percent of dry matter depending on species, harvest conditions, and maturity.
              - Values below 2.0 or above 25.0 percent are uncommon and may reflect analytical or sampling error.
            numeric_id: 182
      - id: fat_content
        fields:
          - id: crude_fat
            title: Crude Fat
            data_type: float
            section: nutrient_analysis
            group: fat_content
            required: false
            valid_range:
              min: 1
              max: 5
            narration: >
              Crude fat represents the ether-extractable portion of the forage sample, including lipids, fatty acids, waxes, and other ether-soluble compounds. While most forage contains
              relatively low fat content, this value contributes to the calculation of total energy. Crude fat is expressed as a percentage of dry matter and is usually measured through
              laboratory extraction techniques. Higher values may occur in treated or ensiled forages, or in hay that has been supplemented with oilseeds or other lipid-rich materials.
            definition: >
              A positive decimal value representing the crude fat content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 1.0 and 5.0.
              - Crude fat represents the ether-extractable lipid content of forage.
              - Typical values range from 2.0 to 3.5 percent of dry matter depending on forage type.
              - Values below 1.0 or above 5.0 percent are rare and may indicate laboratory or sampling error.
            numeric_id: 184
          - id: total_fatty_acids
            title: Total Fatty Acids
            data_type: float
            section: nutrient_analysis
            group: fat_content
            required: false
            valid_range:
              min: 0.5
              max: 4
            narration: >
              Total Fatty Acids (TFA) represent the portion of ether-extractable material in forage that consists specifically of true fatty acids, excluding waxes, pigments, and other non-
              nutritive compounds included in crude fat. TFA is a more refined measure of energy value than crude fat and is used in dairy nutrition models to estimate Net Energy of
              Lactation (NEL), Maintenance (NEM), and Gain (NEG). This value is expressed as a percentage of dry matter and is typically determined through chemical extraction or estimated
              by applying a conversion factor (e.g., 0.8 x crude fat).
            definition: >
              A positive decimal value representing the total fatty acid content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.5 and 4.0.
              - Total fatty acids reflect the true metabolizable lipid content of the forage.
              - Typical values range from 1.5 to 3.0 percent of dry matter.
              - Values below 0.5 or above 4.0 percent are uncommon and may indicate sampling or analytical issues.
            numeric_id: 185
          - id: rumen_unsaturated_fatty_acid_load
            title: Rumen Unsaturated Fatty Acid Load
            data_type: float
            section: nutrient_analysis
            group: fat_content
            required: false
            valid_range:
              min: 0
              max: 5
            narration: >
              Rumen Unsaturated Fatty Acid Load (RUFAL) estimates the concentration of unsaturated fatty acids in forage that may influence rumen fermentation dynamics. Elevated RUFAL levels
              are linked to increased risk of milk fat depression (MFD) in dairy cattle due to changes in rumen biohydrogenation. This value is expressed in grams per kilogram of dry matter
              and is usually calculated from a detailed fatty acid profile. While typical hay values range from 2.0 to 10.0 g/kg, higher levels may be observed in ensiled or oil-enhanced
              forages. RUFAL is a critical factor in ration balancing for lactating cows, particularly when multiple fat sources are present in the diet.
            definition: >
              A positive decimal value representing the Rumen Unsaturated Fatty Acid Load (RUFAL) of the hay sample, expressed in grams per kilogram of forage dry matter.
            validation_guidance: >
              - Must be a decimal between 0.0 and 5.0.
              - RUFAL quantifies the unsaturated fat load in the diet and is used to monitor risk of milk fat depression and fiber digestibility suppression.
              - Typical values range from 0.5 to 3.0 g/100g dry matter.
              - Values above 4.0 are uncommon and may pose risk unless properly managed.
            numeric_id: 186
      - id: digestibility_energy
        fields:
          - id: in_vitro_true_digestibility_30hr_percent_dm
            title: In Vitro True Digestibility 30Hr Percent Dm
            data_type: float
            section: nutrient_analysis
            group: digestibility_energy
            required: false
            valid_range:
              min: 40
              max: 90
            narration: >
              This field reflects In Vitro True Digestibility (IVTD) after 30 hours of laboratory fermentation, simulating rumen conditions. It measures the proportion of the forage that is
              truly digestible by ruminants and is expressed as a percentage of dry matter. IVTD is typically determined using rumen fluid or enzymatic digestion models. Higher values
              indicate higher quality forage and greater energy availability. IVTD is a key metric for dairy and beef producers aiming to improve feed efficiency and optimize production
              outcomes such as milk yield or average daily gain.
            definition: >
              A positive decimal value representing the in vitro true digestibility of the hay sample after 30 hours of fermentation, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 40.0 and 90.0.
              - This field estimates true digestibility of dry matter after 30 hours of in vitro rumen simulation.
              - Typical values range from 55 to 80 percent depending on forage species and maturity.
              - Values below 40 or above 90 percent are rare and may suggest lab or sampling error.
            numeric_id: 188
          - id: neutral_detergent_fiber_digestibility_30hr_percent_ndf
            title: Neutral Detergent Fiber Digestibility 30Hr Percent Ndf
            data_type: float
            section: nutrient_analysis
            group: digestibility_energy
            required: false
            valid_range:
              min: 30
              max: 70
            narration: >
              This field measures Neutral Detergent Fiber Digestibility (NDFD) after 30 hours of fermentation under simulated rumen conditions. It is expressed as a percentage of the total
              NDF content in the forage and indicates how much of the fiber fraction can be digested by ruminants within a biologically meaningful timeframe. Higher NDFD values are
              associated with better forage digestibility, improved dry matter intake, and enhanced animal performance. This metric is commonly used in dairy nutrition models such as NRC and
              CNCPS. Laboratory measurement typically involves rumen fluid incubation or enzymatic digestion protocols.
            definition: >
              A positive decimal value representing the 30-hour in vitro digestibility of the neutral detergent fiber (NDF) portion of the hay sample, expressed as a percentage of NDF.
            validation_guidance: >
              - Must be a decimal between 30.0 and 70.0.
              - This field measures the digestible portion of forage fiber after 30 hours of in vitro fermentation.
              - Typical values range from 40 to 60 percent of NDF depending on species and maturity.
              - Values below 30 or above 70 percent are rare and may indicate lab or sampling error.
            numeric_id: 189
          - id: kd_percent_per_hr
            title: Kd Percent Per Hr
            data_type: float
            section: nutrient_analysis
            group: digestibility_energy
            required: false
            valid_range:
              min: 1
              max: 7
            narration: >
              The kd value represents the fractional rate at which forage dry matter or fiber is digested in the rumen, expressed as the percentage of the component digested per hour. It is
              a dynamic parameter used in ruminant nutrition models to estimate retention time, nutrient availability, and intake potential. Higher kd values reflect more rapidly digestible
              forages, often younger or less lignified. Lower kd values are associated with more mature, weathered, or fibrous material. Measurements are typically obtained through in vitro
              incubation with rumen fluid or estimated using Near Infrared Reflectance (NIR) calibration methods.
            definition: >
              A positive decimal value representing the rate of digestion (kd) of the forage sample, expressed in percent per hour.
            validation_guidance: >
              - Must be a decimal between 1.0 and 7.0.
              - This field estimates the hourly rate of NDF digestion, referred to as "kd".
              - Typical values range from 2.5 to 5.0 percent per hour depending on forage species and maturity.
              - Values below 1.0 or above 7.0 are uncommon and may reflect analytical or sampling issues.
            numeric_id: 190
          - id: total_digestible_nutrients
            title: Total Digestible Nutrients
            data_type: float
            section: nutrient_analysis
            group: digestibility_energy
            required: false
            valid_range:
              min: 40
              max: 70
            narration: >
              Total Digestible Nutrients (TDN) is a composite measure of forage energy content that includes digestible fiber, crude protein, non-fiber carbohydrates, and fat (factored by
              2.25 to reflect its higher energy density). It is a standard metric in forage analysis reports and a key input in ruminant nutrition models. Higher TDN values reflect greater
              energy availability and typically indicate higher forage quality. TDN varies with species, stage of maturity, harvest timing, and preservation conditions. It can be calculated
              from detailed nutrient analyses or predicted using Near Infrared Reflectance Spectroscopy (NIR).
            definition: >
              A positive decimal value representing the Total Digestible Nutrients (TDN) of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 40.0 and 70.0.
              - Total Digestible Nutrients is a core measure of forage energy value.
              - Typical values range from 50 to 65 percent of dry matter depending on forage species, maturity, and quality.
              - Values below 40 or above 70 percent are uncommon and may indicate sampling or testing issues.
            numeric_id: 191
          - id: horse_digestible_energy_mcal_per_lb
            title: Horse Digestible Energy Mcal Per Lb
            data_type: float
            section: nutrient_analysis
            group: digestibility_energy
            required: false
            valid_range:
              min: 0.7
              max: 1.25
            narration: >
              This field represents the Digestible Energy (DE) content of forage for horses, expressed in megacalories per pound of dry matter. DE accounts for the energy available to the
              horse after losses in feces and is the standard energy unit used in equine ration formulation. Typical values vary based on forage type and maturity. Grass hays generally fall
              between 0.80 and 1.00 Mcal/lb, while high-quality alfalfa may exceed 1.15 Mcal/lb. DE may be calculated from nutrient components like TDN or NDF, or derived from empirical
              equations based on equine digestion. This value is used to formulate horse diets according to class-specific energy needs such as maintenance, growth, lactation, or work.
            definition: >
              A positive decimal value representing the Digestible Energy (DE) of the hay sample for horses, expressed in megacalories per pound of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.70 and 1.25.
              - Horse digestible energy reflects the amount of usable energy per pound of forage dry matter for equine diets.
              - Typical values range from 0.85 to 1.10 Mcal/lb depending on forage type and maturity.
              - Values below 0.70 or above 1.25 Mcal/lb are uncommon and may indicate incorrect TDN estimation or testing error.
            numeric_id: 192
      - id: mineral_content
        fields:
          - id: ash
            title: Ash
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 4
              max: 16
            narration: >
              Ash represents the total mineral content of the forage, measured as the residue remaining after complete combustion of the sample. It includes both naturally occurring minerals
              (macro and micro) and any extraneous inorganic material such as dirt or sand introduced during harvest. This value is expressed on a dry matter basis. Ash levels above 12 to 14
              percent are often considered elevated and may indicate soil contamination from raking or baling under poor field conditions. Ash content is important in mineral balancing and
              energy estimation, as excessive ash reduces the organic matter portion of the forage and can lower its effective energy value.
            definition: >
              A positive decimal value representing the ash content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 4.0 and 16.0.
              - Ash reflects the total mineral residue in forage and may indicate either natural mineral content or physical contamination.
              - Typical values range from 6.0 to 10.0 percent of dry matter depending on species and harvest conditions.
              - Values below 4.0 or above 16.0 percent are uncommon and may suggest sampling error, mislabeling, or contamination.
            numeric_id: 194
          - id: calcium
            title: Calcium
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 0.2
              max: 2
            narration: >
              Calcium (Ca) is an essential macromineral required for bone formation, nerve function, muscle contraction, and milk production. Calcium content in forage varies significantly
              depending on plant species, maturity, and soil fertility. Grass hays such as bermudagrass, timothy, and orchardgrass typically contain 0.25% to 0.60% calcium on a dry matter
              basis, while legume hays such as alfalfa or clover range from 1.20% to 2.00%. This value is usually determined through wet chemistry analysis or estimated by Near Infrared
              Reflectance (NIR). Accurate calcium data is critical for ration balancing in dairy cattle, horses, goats, and other livestock, particularly to prevent metabolic disorders such
              as hypocalcemia or milk fever.
            definition: >
              A positive decimal value representing the calcium content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.2 and 2.0.
              - Calcium is a vital mineral for livestock health, especially in lactating and growing animals.
              - Typical values range from 0.3 to 1.8 percent of dry matter depending on forage species.
              - Values below 0.2 or above 2.0 percent are uncommon and may reflect contamination or testing issues.
            numeric_id: 195
          - id: phosphorus
            title: Phosphorus
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 0.1
              max: 0.5
            narration: >
              Phosphorus (P) is an essential macromineral that supports skeletal health, energy metabolism, reproductive performance, and microbial growth in the rumen -- key for digesting
              fibrous forages. Grass hays typically contain 0.15% to 0.35% phosphorus depending on maturity, soil fertility, and harvest timing. Legume hays usually have higher
              concentrations, ranging from 0.25% to 0.45% on a dry matter basis. Forage phosphorus levels can be inadequate in certain regions and may require supplementation. Accurate
              phosphorus values are crucial for maintaining the proper calcium-to-phosphorus ratio in livestock diets, especially for growing animals and horses.
            definition: >
              A positive decimal value representing the phosphorus content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.10 and 0.50.
              - Phosphorus is a critical mineral for energy metabolism and reproduction in livestock.
              - Typical values range from 0.15 to 0.35 percent of dry matter depending on species and soil fertility.
              - Values below 0.10 or above 0.50 percent are uncommon and may suggest fertility issues or testing error.
            numeric_id: 196
          - id: magnesium
            title: Magnesium
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 0.1
              max: 0.5
            narration: >
              Magnesium (Mg) is an essential macromineral critical for neuromuscular coordination, energy metabolism, and skeletal development. In ruminants, inadequate magnesium intake can
              lead to grass tetany (hypomagnesemia), especially when consuming lush spring grasses high in potassium. Grass hays generally contain 0.10% to 0.25% magnesium, while legume hays
              such as alfalfa typically range from 0.20% to 0.40%. This value is expressed on a dry matter basis and is typically determined through wet chemistry or estimated via Near
              Infrared Reflectance (NIR). Monitoring magnesium content is particularly important when potassium or nitrogen fertilization levels are high, as these nutrients can interfere
              with magnesium absorption.
            definition: >
              A positive decimal value representing the magnesium content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.10 and 0.50.
              - Magnesium is important for muscle and nerve function and is especially critical in spring grazing systems.
              - Typical values range from 0.15 to 0.35 percent of dry matter depending on forage type and fertility.
              - Values below 0.10 or above 0.50 percent are uncommon and may reflect sampling or testing error.
            numeric_id: 197
          - id: potassium
            title: Potassium
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 1
              max: 5
            narration: >
              Potassium (K) is an essential macromineral that supports fluid balance, nerve signaling, muscle contraction, and overall plant health. In forage, potassium concentrations vary
              by species and fertilization. Grass hays typically contain 1.00% to 3.00% potassium, while legume hays -- particularly those that are heavily fertilized -- often range from
              2.00% to 3.50%. Although potassium is vital, excessive levels can disrupt the absorption of magnesium and calcium in ruminants, contributing to metabolic disorders such as
              grass tetany and milk fever. Potassium content is expressed as a percentage of dry matter and is determined via wet chemistry or estimated using NIR. Levels above 3.00% may
              necessitate careful dietary adjustment, especially for periparturient dairy cows or spring-calving beef herds.
            definition: >
              A positive decimal value representing the potassium content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 1.0 and 5.0.
              - Potassium is essential but can interfere with other minerals when present in excess.
              - Typical values range from 1.5 to 3.5 percent of dry matter depending on species, soil fertility, and harvest timing.
              - Values below 1.0 or above 5.0 percent are uncommon and may indicate fertility extremes or analytical error.
            numeric_id: 198
          - id: sulfur
            title: Sulfur
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 0.1
              max: 0.5
            narration: >
              Sulfur (S) is an essential mineral involved in the synthesis of sulfur-containing amino acids (e.g., methionine and cysteine) and the production of B-vitamins by rumen
              microbes. It also supports structural integrity of tissues such as wool, hair, and hooves. Grass hays typically contain 0.10% to 0.25% sulfur, while legume hays may provide
              0.20% to 0.35%. When total dietary sulfur -- including water and supplemental feed -- exceeds 0.40%, the risk of neurologic disorders like polioencephalomalacia (PEM)
              increases, particularly in cattle and sheep. Sulfur values are expressed on a dry matter basis and are especially important to monitor in rations for high-performance or
              confined livestock systems.
            definition: >
              A positive decimal value representing the sulfur content of the hay sample, expressed as a percentage of dry matter.
            validation_guidance: >
              - Must be a decimal between 0.10 and 0.45.
              - Sulfur is essential for rumen microbial activity and amino acid synthesis.
              - Typical values range from 0.10 to 0.25 percent for grass hay and from 0.20 to 0.35 percent for legume hay.
              - Values above 0.40 percent may pose a risk of toxicity and should be evaluated alongside water and supplement sources.
            numeric_id: 199
          - id: chloride_ion
            title: Chloride Ion
            data_type: string
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 0.1
              max: 1
            valid_values_additional: "`trace`"
            narration: >
              Chloride (Cl-) is a negatively charged electrolyte that contributes to acid-base balance, osmoregulation, and hydrochloric acid production in the digestive tract. In forage
              analysis, chloride is typically expressed as a percentage of dry matter.

              Chloride is particularly important in dairy nutrition for calculating the Dietary Cation-Anion Difference (DCAD), which influences calcium metabolism and the risk of milk
              fever. Forages with high chloride concentrations are often used in close-up rations to promote a mild metabolic acidosis.

              Most hays contain between 0.20% and 0.50% chloride. Concentrations above 0.60% are uncommon and may result from exposure to salt-rich water, coastal spray, or chloride-
              containing fertilizers.
            definition: >
              A positive decimal value representing the chloride ion (Cl-) content of the hay sample, expressed as a percentage of dry matter. Typical values range from 0.20% to 0.50%.
              Values above 0.60% may indicate contamination or unusual environmental exposure.
            validation_guidance: >
              - This field is of type `string` to accommodate both numeric values and the special entry `trace`.
              - Use `trace` when chloride is present but falls below the quantifiable detection limit of the testing method.
              - Otherwise, the value must be a decimal between 0.10 and 0.60, representing percent of dry matter.
              - Typical values fall between 0.20 and 0.50.
              - Values above 0.60 may indicate contamination from manure, saline water, or fertilization and should be reviewed.
            numeric_id: 200
          - id: iron_ppm
            title: Iron Ppm
            data_type: int
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 50
              max: 1500
            narration: >
              Iron (Fe) is a trace mineral required for critical biological functions such as oxygen transport, enzymatic activity, and immune support. It is usually present in sufficient
              quantities in forages, making deficiencies uncommon. Most hay samples contain between 100 and 500 ppm of iron on a dry matter basis. However, excessively high iron --
              particularly from soil contamination or iron-rich irrigation water -- can impair the absorption of other important trace minerals, including copper, zinc, and manganese. When
              total dietary iron exceeds 1,000 ppm, adjustments to the mineral program may be necessary to maintain nutritional balance.
            definition: >
              A positive integer representing the iron content of the hay sample in parts per million (ppm).
            validation_guidance: >
              - Must be an integer between 50 and 1500.
              - Iron is an essential trace mineral, but excess amounts may indicate soil or rust contamination.
              - Typical forage levels range from 100 to 500 ppm.
              - Values above 1000 ppm warrant further review and may impair absorption of other trace minerals.
            numeric_id: 201
          - id: zinc_ppm
            title: Zinc Ppm
            data_type: int
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 15
              max: 100
            narration: >
              Zinc (Zn) is a vital trace mineral that supports enzyme function, immune response, wound healing, and reproductive performance. Forage zinc concentrations are often marginal,
              especially in the presence of high calcium or iron, which can reduce zinc bioavailability. Zinc is measured in parts per million (ppm) on a dry matter basis, with most hay
              samples ranging from 20 to 50 ppm. Levels below 30 ppm are considered suboptimal for many classes of livestock and often necessitate supplementation. Monitoring zinc is
              especially important for young growing animals, breeding stock, and high-producing dairy cows to ensure proper health and performance.
            definition: >
              A positive integer representing the zinc content of the hay sample in parts per million (ppm).
            validation_guidance: >
              - Must be an integer between 15 and 100.
              - Zinc is a critical trace mineral for growth, reproduction, and immune function.
              - Typical forage values range from 20 to 50 ppm.
              - Values below 15 ppm may be deficient; values above 100 ppm are rare and may indicate contamination or mineral oversupply.
            numeric_id: 202
          - id: copper_ppm
            title: Copper Ppm
            data_type: int
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 4
              max: 30
            narration: >
              Copper (Cu) is an essential trace mineral that supports enzyme systems, immune function, connective tissue formation, and pigmentation. It is one of the most commonly deficient
              trace minerals in forage-based diets, especially in regions with high levels of soil iron, sulfur, or molybdenum, which reduce copper availability. Forage copper levels are
              reported in parts per million (ppm) on a dry matter basis. Most hay samples range from 5 to 15 ppm. Values below 8 ppm are often considered marginal and may require
              supplementation, while levels above 20 ppm can be toxic to sheep and must be evaluated with caution. When interpreting copper values, it's important to account for antagonistic
              minerals in the total diet, not just the forage component.
            definition: >
              A positive integer representing the copper content of the hay sample in parts per million (ppm).
            validation_guidance: >
              - Must be an integer between 4 and 30.
              - Copper is essential for reproduction, immunity, and enzyme function.
              - Typical forage values range from 5 to 15 ppm depending on species and soil conditions.
              - Values below 4 ppm may be deficient; values above 30 ppm may pose toxicity risks, especially in sheep.
            numeric_id: 203
          - id: manganese_ppm
            title: Manganese Ppm
            data_type: int
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 20
              max: 400
            narration: >
              Manganese (Mn) is a trace mineral essential for bone development, reproductive function, and antioxidant defense systems. Although forage manganese concentrations are often
              high, the element's bioavailability is low and can be further diminished by elevated dietary iron or calcium. Manganese is reported in parts per million (ppm) on a dry matter
              basis. Most hay samples fall within the 40 to 300 ppm range. Concentrations below 40 ppm may be inadequate, particularly for growing or breeding livestock in high-antagonist
              mineral environments. While manganese toxicity is rare, even at levels above 400 ppm, excessive intake may still contribute to mineral imbalances and should be considered in
              the context of the total dietary load.
            definition: >
              A positive integer representing the manganese content of the hay sample in parts per million (ppm).
            validation_guidance: >
              - Must be an integer between 20 and 400.
              - Manganese supports bone growth, reproduction, and antioxidant defense.
              - Typical forage values range from 30 to 100 ppm depending on species and soil conditions.
              - Values below 20 ppm may be deficient; values above 400 ppm are uncommon and may interfere with absorption of other minerals.
            numeric_id: 204
          - id: molybdenum_ppm
            title: Molybdenum Ppm
            data_type: float
            section: nutrient_analysis
            group: mineral_content
            required: false
            valid_range:
              min: 0.1
              max: 5
            narration: >
              Molybdenum (Mo) is a trace mineral needed in very small quantities for enzyme function in livestock. However, excessive molybdenum can lead to the formation of thiomolybdates
              in the rumen, which bind copper and prevent its absorption -- causing secondary copper deficiency. Forage molybdenum is reported in parts per million (ppm) on a dry matter
              basis. Most forages contain less than 2.0 ppm. Concentrations above 3.0 ppm, particularly when sulfur is also elevated, can significantly impair copper metabolism. Levels above
              5.0 ppm are considered high risk for ruminants, especially cattle and sheep. Monitoring molybdenum is critical for diagnosing trace mineral imbalances and adjusting
              supplementation strategies. When elevated, chelated copper sources or increased dietary copper may be needed to maintain adequate copper status.
            definition: >
              A positive decimal value representing the molybdenum content of the hay sample in parts per million (ppm).
            validation_guidance: >
              - Must be a decimal between 0.1 and 5.0.
              - Molybdenum is essential in trace amounts but may induce copper deficiency when elevated.
              - Typical forage values range from 0.5 to 2.0 ppm.
              - Values above 5.0 ppm are uncommon and may trigger copper antagonism, particularly in cattle and sheep.
            numeric_id: 205
    fields:
      - id: lab_processing
        title: Lab Sample Processing
        data_type: group
        section: nutrient_analysis
        required: false
        narration: >
          This group captures the full context of laboratory testing, from sample collection through result reporting. It documents who took the sample, under what conditions, when it
          was tested, and by which lab. It also includes method references and any relevant processing notes or quality flags.
        definition: >
          Describes how the forage sample was selected, handled, and analyzed in a laboratory setting, including who sampled it, how it was tested, and what methods were used.
        validation_guidance: >
