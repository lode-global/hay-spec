      - id: forage_quality_indexes
        title: Forage Quality Indexes
        data_type: group
        section: nutrient_analysis
        required: false
        narration: >
          This group includes widely used forage indexes that summarize the hay's overall quality for feeding purposes.

          Relative Feed Value (RFV) estimates intake potential and digestibility based on ADF and NDF values, while Relative Forage Quality (RFQ) improves upon RFV by incorporating fiber
          digestibility. These indexes allow buyers, nutritionists, and producers to compare hay lots consistently and determine suitability for specific livestock classes or feeding
          programs.
        definition: >
          Contains standardized forage quality indexes derived from fiber and energy content to evaluate feed value across hay types.
