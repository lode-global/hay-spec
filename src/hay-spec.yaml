      - id: carbohydrate_profile
        title: Carbohydrate Profile
        data_type: group
        section: nutrient_analysis
        required: false
        narration: >
          This group characterizes the forage's carbohydrate makeup, including fiber fractions and non-fiber carbohydrates. It helps quantify both slowly and rapidly fermentable energy
          sources, guiding ration formulation for energy balance and digestive health.

          Structural carbohydrates such as ADF and NDF affect intake and digestibility, while non-fiber components such as starch and WSC influence fermentation rate and rumen dynamics.
