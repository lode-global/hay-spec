# yamllint disable rule:document-start
title: Hay Description Specification
version: 0.91.0
status: draft

sections:
  - id: introduction
    title: Introduction and Front Matter
    data_type: section
    required: true
    narration: >
      Hay is a foundational agricultural commodity, essential to the nutrition of dairy and beef cattle, horses, goats, camels, sheep, and other animals. In the United States, hay
      ranks among the leading cash crops by annual sales value, alongside corn, wheat, and soybeans. Yet unlike those crops, hay is traded entirely on an over-the-counter basis --
      through peer-to-peer negotiation, dealers, or brokers -- without common product definitions or standardized digital tools.

      The hay market does not inherently require centralized exchanges to function well. But it does suffer from two critical deficiencies: buyers and sellers struggle to find one
      another efficiently, and there is limited electronic facilitation of trading, particularly in matching, documentation, and decision support.

      These limitations stem in part from the lack of shared standards. Without consistent product descriptions or data conventions, hay listings and negotiations rely on informal
      descriptions, resulting in persistent mismatches in perceptions of quality, weak price signals, and high friction in trade. This hinders regional and global commerce, limits
      market transparency, and slows investment in modern tools for production, logistics, testing, and quality control.

      Efforts to standardize hay go back more than a century. As recently as the late 19th century, centralized hay markets operated in cities such as Boston, Chicago, and San
      Francisco. Since then, producer groups, academic institutions, extension agencies, and the U.S. Department of Agriculture have all proposed grading systems. But none has achieved
      enduring, widespread adoption.

      Several developments now offer new opportunities for progress. Hay exports are growing, especially alfalfa, which now trades across borders under increasingly formalized
      standards. Testing technologies have matured, including laboratory-based wet chemistry and near-infrared reflectance (NIR) spectroscopy. Digital tools and platforms are emerging,
      enabling traceability from field to bale. Online infrastructure allows global coordination, opening the door for community-led standards and interoperability.

      This document proposes a formal product definition for hay -- a structured data model that captures economically salient characteristics in a consistent format. Such a definition
      supports better listings, search, comparison, and traceability. Over time, it may also surface replacements in market behavior that inform the development of accepted grading
      practices.

      This specification is published by Lode, a platform for improving transparency and connectivity in agricultural commodities markets. To participate or provide feedback, contact
      us at standards@lode.global or visit lode.global.

      This is a working draft subject to field testing and stakeholder refinement. Planned additions include a reference dataset of forage varieties with identifiers and metadata, and
      a registry of forage analysis laboratories supporting the specified testing methods and protocols.
    definition: >
      Introduces the hay specification's purpose, scope, and intended usage. Provides context for its development, importance, and structure, including audience, terminology, and field
      naming conventions.
    numeric_id: 1

  - id: location
    title: Field Location and Growing Environment
    data_type: section
    required: true
    narration: >
      This section describes the field location and environmental characteristics where the hay was produced. Geographic factors play a significant role in hay quality, influencing
      aspects such as nutrient content, texture, and palatability. Elevation, climate classification, and irrigation infrastructure all shape growing conditions and harvesting
      outcomes.

      These fields support traceability, enable regional comparisons, and help buyers assess how site-specific factors may affect hay performance for their intended use.
    definition: >
      Specifies the geographic and environmental setting of the field or production area, including identifiers, region, climate, and proximity to known environmental risks. Aids in
      understanding growing conditions and risk factors.
    numeric_id: 2
    fields:
      - id: hay_origin_country_code
        title: Hay Origin Country Code
        data_type: enum
        section: location
        required: true
        valid_values:
          - "`[]`"
        valid_values_reference: "`country_codes`"
        narration: >
          This field enables consistent identification of the national origin of the hay. It supports traceability, regulatory compliance, and buyer transparency.

          Standardized country codes simplify reporting, reduce ambiguity, and allow system-level filtering, sorting, and cross-border analysis.

          Systems may implement dropdown menus or auto-complete tools linked to an ISO country code list to reduce input errors.
        definition: >
          Specifies the country in which the hay was produced, using the standardized ISO 3166-1 alpha-2 code.
        validation_guidance: >
          Must be a valid 2-letter ISO 3166-1 alpha-2 country code (e.g., `US`, `CA`, `MX`).
        numeric_id: 3
      - id: hay_origin_subdivision_code
        title: Hay Origin Subdivision Code
        data_type: enum
        section: location
        required: true
        valid_values:
          - "`[]`"
        valid_values_reference: "`subdivision_codes`"
        narration: >
          This field identifies the state, province, or regional unit where the hay was grown. The ISO 3166-2 format includes the country code followed by a hyphen and a regional code
          (e.g., `US-TX` for Texas).

          Use of subdivision codes supports consistent traceability, regional reporting, and compatibility with compliance and geographic datasets.

          System interfaces may enable filtering by region after a country code is selected to reduce input errors and simplify user workflows.

          A small number of countries, e.g., Singapore, do not have subdivisions and will take a value of `not_applicable` from the `subdivision_codes` reference list.
        definition: >
          Specifies the first-level administrative region associated with the hay's origin, using the ISO 3166-2 code format.
        validation_guidance: >
          - Must be a valid ISO 3166-2 subdivision code (e.g., `US-TX`, `CA-ON`).
          - For countries with no defined subdivisions, use `not_applicable`.
          - The list of valid values is maintained in the `subdivision_codes` reference list.
        numeric_id: 4
      - id: hay_origin_county
        title: Hay Origin County
        data_type: string
        section: location
        required: true
        valid_values:
          - "`[]`"
        valid_values_reference: "`us_county_names`"
        narration: >
          This field captures localized geographic origin below the state or provincial level. It may be useful for regulatory programs, extension service classification, or region-
          specific marketing.

          Because naming conventions vary internationally, this field does not require a controlled vocabulary. However, systems may optionally provide a lookup list based on selected
          country and subdivision to improve consistency.

          Used alongside `hay_origin_country_code` and `hay_origin_subdivision_code`, this field helps complete a full geographic trace of the hay's production site.
        definition: >
          Records the county, parish, district, or equivalent subnational jurisdiction in which the hay was grown.
        validation_guidance: >
          If the hay was grown in the United States, this field should contain a valid U.S. county name (e.g., `Tulare`, `Lancaster`, `Hays`).

          Valid county names are defined in the `us_county_names` reference list and should be spelled exactly as published by the U.S. Census Bureau or relevant state authority.

          If future linkage to regulatory systems or APIs is required, a corresponding `hay_origin_county_code` field (e.g., FIPS code) may be added.

          Outside the U.S., this field may be left blank or populated with a free-text regional equivalent.

          Maximum length for free-text entries: 100 characters.
        numeric_id: 5
      - id: hay_origin_postal_code
        title: Hay Origin Postal Code
        data_type: string
        section: location
        required: true
        narration: >
          This field provides highly localized origin data that supports logistics, mapping, and regulatory compliance.

          Postal codes vary by country -- for example: 90210 (United States), K1A 0B1 (Canada), 75008 (France).

          Used in combination with country, subdivision, and county fields, the postal code contributes to full geographic traceability.

          Systems may optionally validate format against the selected country or enable auto-complete features to improve data accuracy.
        definition: >
          Captures the postal code (or ZIP code) for the location where the hay was grown.
        validation_guidance: >
          - Postal or zip code.
          - Free-text field. Maximum length: 20 characters.
          - Must align with format conventions of the associated country.
        numeric_id: 6
      - id: source_field_elevation
        title: Source Field Elevation
        data_type: int
        section: location
        required: true
        valid_range:
          min: -300
          max: 13000
        narration: >
          Elevation can affect forage species suitability, yield, and nutrient density due to climatic and soil influences. This value should reflect the average elevation of the
          production field.

          Interpretation requires pairing with `source_field_elevation_units`, which identifies whether the value is in meters or feet.

          Unusually high or low elevations may warrant review. Use of geographic lookup tools may improve accuracy and consistency across submissions.
        definition: >
          Records the elevation of the field in which the hay was grown, measured as height above or below sea level.
        validation_guidance: >
          - Must be a whole number between -300 and 13000.
          - Elevation is expressed in the unit specified by `source_field_elevation_units`.
          - Values below 0 represent locations below sea level.
          - Values above 10000 are uncommon and may reflect mountainous terrain or data entry error.
        cross_field_consistency: >
          - The value of `source_field_elevation` must be interpreted in the units specified by `source_field_elevation_units`.
          - If `source_field_elevation_units` is `meters`, ensure values align with typical elevation ranges in meters.
          - If `source_field_elevation_units` is `feet`, ensure values align with typical elevation ranges in feet.
          - Optional future validation: cross-check `source_field_elevation` against known elevation ranges for `hay_origin_country_code`, `hay_origin_subdivision_code`,
          `hay_origin_county`, or `hay_origin_postal_code` to detect improbable values.
        numeric_id: 7
      - id: source_field_elevation_units
        title: Source Field Elevation Units
        data_type: enum
        section: location
        required: true
        enum_select_mode: single
        valid_values:
          - "`meters`"
          - "`feet`"
        narration: >
          This field defines how the elevation value should be interpreted -- either as meters or feet above (or below) sea level.

          - `meters` -- Metric unit commonly used worldwide.
          - `feet` -- Imperial unit often used in the United States.

          Pairing units explicitly with elevation allows systems to convert and compare values reliably across geographies. Values should be checked for plausibility based on the
          selected unit -- for example, values exceeding 9,000 meters or 30,000 feet may require review.
        definition: >
          Specifies the unit of measurement used in the `source_field_elevation` field.
        validation_guidance: >
          Valid values: `meters`, `feet`.
        numeric_id: 8
      - id: source_field_climate_class
        title: Source Field Climate Class
        data_type: enum
        section: location
        required: true
        valid_values:
          - "`[]`"
        valid_values_reference: "`climate_codes`"
        narration: >
          This field provides environmental context about the hay's production zone using a widely recognized climate classification system.

          Examples:
          - `Cfa` -- Humid subtropical (e.g., Southeastern U.S.).
          - `BSk` -- Cold semi-arid (e.g., High Plains).
          - `Dfb` -- Humid continental, warm summer (e.g., Upper Midwest).

          Koppen-Geiger codes reflect key climatic factors like temperature patterns and precipitation. Including this data helps agronomists and buyers interpret forage characteristics,
          growing season dynamics, and crop risk profiles.
        definition: >
          Records the generalized climate classification for the field where the hay was grown, using the Koppen-Geiger system.
        validation_guidance: >
          - Must be a valid 2- to 3-letter Koppen-Geiger climate code (e.g., `Cfa`, `BSk`, `Dfb`).
          - Values are case-sensitive.
        numeric_id: 9
      - id: source_field_name
        title: Source Field Name
        data_type: string
        section: location
        required: false
        narration: >
          This value can help associate the hay lot with operational field names in farm records, maps, or traceability systems. Use plain, concise naming.

          If the hay was sourced from more than one field, use the keyword `multi_field`.

          A blank value does not imply multiple fields.
        definition: >
          Name or label used by the producer to identify the field or block from which the hay was harvested.
        validation_guidance: >
          - Maximum length: 100 characters.
          - Do not use formatting, special characters, or markup.
          - If using the keyword `multi_field`, then `hay_single_lot_traceable` must be set to `false`.
        numeric_id: 10
      - id: source_field_id
        title: Source Field ID
        data_type: string
        section: location
        required: false
        narration: >
          This may be a growers internal ID, a land parcel number, or a geographic reference used in farm management software. Use consistent formatting where applicable.

          If the hay was sourced from more than one field, use the keyword `multi-field`.

          A blank value does not imply multiple fields.
        definition: >
          Internal or external identifier used to uniquely reference the field or block where the hay was grown.
        validation_guidance: >
          - Maximum length: 100 characters.
          - Use plain text only.
          - If using the keyword `multi-field`, then `hay_single_lot_traceable` must be set to `false`.
        numeric_id: 11
      - id: source_field_area
        title: Source Field Area
        data_type: float
        section: location
        required: false
        valid_range:
          min: 0.01
          max: 10000
        narration: >
          Captures the size of the field or parcel from which the hay was harvested. Field area is relevant for assessing yield per unit area, validating production claims, and
          understanding the scale of the operation.
        definition: >
          Specifies the total land area from which the hay was harvested.
        validation_guidance: >
          - Must be a positive decimal between 0.01 and 10000.0.
          - Represents the total area of the source field.
          - Units are defined by `source_field_area_units`.
          - Most fields fall between 5 and 500 acres.
          - Values above 1000 acres are uncommon and may reflect consolidated or irrigated production zones.
        numeric_id: 12
      - id: source_field_area_units
        title: Source Field Area Units
        data_type: enum
        section: location
        required: false
        required_if:
          field: source_field_area
          operator: value_present
          value: true
        enum_select_mode: single
        valid_values:
          - "`acres`"
          - "`hectares`"
        narration: >
          This field defines whether the reported area is expressed in acres or hectares.

          - `acres` -- Commonly used in the United States and a few other countries.
          - `hectares` -- Standard metric unit equal to 10,000 square meters.

          Selecting the correct unit ensures comparability and prevents misinterpretation in area-based calculations. Required when `source_field_area` is provided.
        definition: >
          Specifies the unit of measurement used in the `source_field_area` field.
        validation_guidance: >
          - Valid values: `acres`, `hectares`.
          - Required if `source_field_area` is populated.
        numeric_id: 13
      - id: irrigation_status
        title: Irrigation Status
        data_type: enum
        section: location
        required: false
        enum_select_mode: single
        valid_values:
          - "`rainfed_only`"
          - "`irrigation_available`"
          - "`irrigation_required`"
        narration: >
          This field indicates whether irrigation was necessary, optional, or unused in the production of the hay crop.

          - `rainfed_only` -- The crop relied entirely on rainfall.
          - `irrigation_available` -- Irrigation systems are present but not necessarily used.
          - `irrigation_required` -- Irrigation is necessary for successful production.

          This field offers insight into water dependency, production risk, and sustainability considerations. It complements `irrigation_method_available` and `irrigation_method_used`.
        definition: >
          Describes the general irrigation context in which the hay was grown.
        validation_guidance: >
          Valid values: `rainfed_only`, `irrigation_available`, `irrigation_required`.
        numeric_id: 14
      - id: irrigation_method_available
        title: Irrigation Method Available
        data_type: enum
        section: location
        required: false
        enum_select_mode: multiple
        valid_values:
          - "`none`"
          - "`flood`"
          - "`sprinkler`"
          - "`pivot`"
          - "`drip`"
          - "`unknown`"
        narration: >
          This field describes the irrigation infrastructure or capacity available to the grower for this hay crop.

          - `none` -- No irrigation equipment or systems are available.
          - `flood` -- Water is applied using gravity flow across the surface.
          - `sprinkler` -- Water is applied using stationary or portable sprinklers.
          - `pivot` -- Water is applied using a rotating center-pivot system.
          - `drip` -- Water is delivered directly to the root zone through emitters.
          - `unknown` -- Irrigation method is unknown or unreported.

          This field reflects technical capacity and complements `irrigation_status`, which describes agronomic necessity.
        definition: >
          Indicates the primary irrigation method available to the producer, regardless of whether it was used during this crop cycle.
        validation_guidance: >
          Valid values: `none`, `flood`, `sprinkler`, `pivot`, `drip`, `unknown`.
        numeric_id: 15
      - id: irrigation_method_used
        title: Irrigation Method Used
        data_type: enum
        section: location
        required: false
        enum_select_mode: single
        valid_values:
          - "`none`"
          - "`flood`"
          - "`sprinkler`"
          - "`pivot`"
          - "`drip`"
          - "`unknown`"
        narration: >
          This field identifies the method of irrigation, if any, that was applied to the hay crop in the field season leading up to harvest.

          - `none` -- No irrigation was used; the crop was fully rainfed.
          - `flood` -- Gravity-flow water was used to irrigate the field.
          - `sprinkler` -- Water was applied via fixed or mobile sprinklers.
          - `pivot` -- A center-pivot system delivered water in arcs or circles.
          - `drip` -- Water was applied directly to the root zone using drip lines or emitters.
          - `unknown` -- Irrigation method is unknown or unreported.

          This field is useful for assessing actual water inputs and complements `irrigation_method_available`, which describes infrastructure rather than practice.
        definition: >
          Records the primary irrigation method actually used during the most recent production cycle of the hay crop.
        validation_guidance: >
          - Valid values: `none`, `flood`, `sprinkler`, `pivot`, `drip`, `unknown`.
          - If `irrigation_method_available` is `none`, then this field must also be `none`.
        numeric_id: 16

  - id: soil
    title: Soil and Field Management
    data_type: section
    required: true
    narration: >
      This section captures how the grower prepares and maintains the soil to support a healthy forage stand. It includes information about fertilizer applications, soil amendments,
      and general nutrient management.

      These practices influence crop yield, plant vigor, and nutritional quality of the harvested hay. They also help downstream users assess environmental practices, sustainability,
      and alignment with production goals, such as high-protein dairy forage versus lower-input grazing hay.

      Where applicable, fields differentiate between nutrient application to legume and grass crops -- acknowledging, for example, that nitrogen is often unnecessary for legumes due to
      biological nitrogen fixation.
    definition: >
      Summarizes field-level soil characteristics and management practices, such as pH, amendments, drainage, and compaction. These factors affect forage nutrient uptake, yield
      potential, and long-term field performance.
    numeric_id: 17
    groups:
      - id: fertilizer_timing
        fields:
          - id: date_fertilized_nitrogen
            title: Date Fertilized Nitrogen
            data_type: date
            section: soil
            group: fertilizer_timing
            required: false
            narration: >
              Nitrogen fertilization is a key factor influencing crude protein levels, growth rate, and overall forage yield. Timely disclosure helps buyers assess nitrate risk and
              understand expected nutrient content.
            definition: >
              Captures the most recent application date of nitrogen fertilizer for the hay crop.
            validation_guidance: >
              - Must be formatted as `YYYYMMDD`.
              - Use `YYYYMM00` if day is unknown.
              - Use `YYYY0000` if both month and day are unknown.
              - Use `00000000` if no date is available or applicable.
            numeric_id: 23
          - id: date_fertilized_potassium
            title: Date Fertilized Potassium
            data_type: date
            section: soil
            group: fertilizer_timing
            required: false
            narration: >
              Potassium supports plant water regulation, stress tolerance, and disease resistance -- all of which influence forage quality and yield. Disclosing potassium use assists in
              evaluating stand health and potential forage longevity.
            definition: >
              Indicates the most recent application date of potassium fertilizer.
            validation_guidance: >
              - Must be formatted as `YYYYMMDD`.
              - Use `YYYYMM00` if day is unknown.
              - Use `YYYY0000` if both month and day are unknown.
              - Use `00000000` if no date is available or applicable.
            numeric_id: 24
          - id: date_fertilized_phosphorus
            title: Date Fertilized Phosphorus
            data_type: date
            section: soil
            group: fertilizer_timing
            required: false
            narration: >
              Phosphorus promotes root development, stand establishment, and early plant growth -- all critical for long-term forage productivity. Understanding phosphorus usage helps
              evaluate early season vigor and nutrient management strategy.
            definition: >
              Documents the most recent application date of phosphorus fertilizer.
            validation_guidance: >
              - Must be formatted as `YYYYMMDD`.
              - Use `YYYYMM00` if day is unknown.
              - Use `YYYY0000` if both month and day are unknown.
              - Use `00000000` if no date is available or applicable.
            numeric_id: 25
      - id: fertilizer_rates
        fields:
          - id: amount_fertilized_nitrogen
            title: Amount Fertilized Nitrogen
            data_type: int
            section: soil
            group: fertilizer_rates
            required: false
            valid_range:
              min: 0
              max: 300
            narration: >
              Nitrogen is the most yield-limiting nutrient in many forage systems. Accurate reporting of nitrogen application rates supports interpretation of protein content and potential
              nitrate accumulation in the harvested crop.
            definition: >
              Captures the quantity of nitrogen applied during the most recent fertilization event. Nitrogen influences plant growth, crude protein levels, and overall yield. This field must
              be interpreted in conjunction with `amount_fertilized_units`, which defines the unit of measure.
            validation_guidance: >
              - Must be a decimal between 0.0 and 300.0.
              - Represents the total nitrogen fertilizer applied for this cutting.
              - Typical rates range from 30 to 100 pounds per acre depending on species and yield goals.
              - Values above 200 may indicate high-yield systems or multiple split applications.
              - Use 0.0 if no nitrogen was applied.
            numeric_id: 27
          - id: amount_fertilized_potassium
            title: Amount Fertilized Potassium
            data_type: int
            section: soil
            group: fertilizer_rates
            required: false
            valid_range:
              min: 0
              max: 200
            narration: >
              Potassium plays a key role in regulating plant water use and stress resilience. Accurate potassium application data helps buyers assess potential forage longevity and
              structural integrity, especially in perennial stands.
            definition: >
              Specifies the quantity of potassium applied during the most recent fertilization event. Potassium enhances plant tolerance to drought and disease, supports stem strength, and
              improves forage quality. The applicable unit is defined in `amount_fertilized_units`.
            validation_guidance: >
              - Must be a decimal between 0.0 and 200.0.
              - Represents the amount of phosphorus fertilizer applied for this cutting.
              - Most applications range from 20 to 80 pounds per acre depending on soil test results.
              - Values above 150 are uncommon and may indicate aggressive fertility correction.
              - Use 0.0 if no phosphorus was applied.
            numeric_id: 28
          - id: amount_fertilized_phosphorus
            title: Amount Fertilized Phosphorus
            data_type: int
            section: soil
            group: fertilizer_rates
            required: false
            valid_range:
              min: 0
              max: 400
            narration: >
              Phosphorus supports early stand establishment and vigorous growth, particularly in young or reseeded fields. Disclosing phosphorus rates helps agronomists assess nutrient
              strategy and allows buyers to better understand expected forage performance.
            definition: >
              Indicates the quantity of phosphorus applied during the most recent fertilization event. Phosphorus is vital for root development, energy transfer, and early-season growth in
              forage crops. This field should be interpreted in conjunction with amount_fertilized_units.
            validation_guidance: >
              - Must be a decimal between 0.0 and 400.0.
              - Represents the amount of potassium fertilizer applied for this cutting.
              - Typical applications range from 40 to 200 pounds per acre.
              - Values above 300 are uncommon and may indicate potassium buildup or high-yield management.
              - Use 0.0 if no potassium was applied.
            numeric_id: 29
          - id: amount_fertilized_units
            title: Amount Fertilized Units
            data_type: enum
            section: soil
            group: fertilizer_rates
            required: false
            required_if:
              any_populated:
                - amount_fertilized_nitrogen
                - amount_fertilized_phosphorus
                - amount_fertilized_potassium
              operator: value_present
              value: true
            enum_select_mode: single
            valid_values:
              - "`kilograms_per_hectare`"
              - "`pounds_per_acre`"
            narration: >
              This field defines the units used to report fertilizer application rates. Consistency in unit selection is essential for accurate interpretation, comparison, and analysis
              across records. Most U.S. producers will use pounds per acre, while metric-based systems typically use kilograms per hectare.
            definition: >
              Specifies the unit of measure for the fertilizer quantity fields:
              - `amount_fertilized_nitrogen`
              - `amount_fertilized_potassium`
              - `amount_fertilized_phosphorus`
            validation_guidance: >
              - Required if any `amount_fertilized_*` fields are populated.
              - Choose only one unit system per entry.
              - Valid values: `pounds_per_acre`, `kilograms_per_hectare`.
            numeric_id: 30
      - id: organic_amendments
        fields:
          - id: organic_amendments_applied
            title: Organic Amendments Applied
            data_type: "object[]"
            section: soil
            group: organic_amendments
            required: false
            narration: >
              This component provides detailed records of each organic amendment application. It supports evaluation of nutrient management practices, sustainability claims, and soil health
              strategies over time. Repeatable structure allows for multiple amendment types or application dates to be documented separately.
            definition: >
              A list of organic amendments applied to the soil. Each entry represents a separate application of compost, manure, crop residue, or similar material.
            validation_guidance: >
              - This component captures each organic or mineral amendment applied to the field.
              - The component includes the following fields:
              - `amendment_type`
              - `amendment_amount`
              - `amendment_units`
              - Each entry must include a valid amendment type, amount, and unit.
              - Amount must be a whole number between 0 and 50000.
              - Typical values range from 1 to 10 tons per acre (2,000 to 20,000 pounds per acre). Higher ratesup to 20 tons per acremay occur in intensive organic systems or during soil
              remediation.
              - Units must correspond logically to the amendment type.
            numeric_id: 32
            components:
              - id: amendment_type
                title: Amendment Type
                data_type: enum
                section: soil
                group: organic_amendments
                parent_id: organic_amendments_applied
                required: false
                enum_select_mode: single
                valid_values:
                  - "`compost`"
                  - "`manure`"
                  - "`cover_crop_residue`"
                  - "`biochar`"
                  - "`other`"
                narration: >
                  This field identifies the general category of amendment used in each application event. Understanding the type of organic input supports evaluation of nutrient contribution,
                  soil-building properties, and alignment with sustainability or certification goals.
                definition: >
                  Specifies the type of organic or biological amendment applied to the soil.
                validation_guidance: >
                  - Valid values: `compost`, `manure`, `cover_crop_residue`, `biochar`, `other`.
                  - Use consistent terminology across entries.
                numeric_id: 33
              - id: amendment_amount
                title: Amendment Amount
                data_type: int
                section: soil
                group: organic_amendments
                parent_id: organic_amendments_applied
                required: false
                valid_range:
                  min: 0
                  max: 50000
                narration: >
                  This field captures the amount of an organic amendment such as compost or manure, applied to the field. It should be interpreted in conjunction with `amendment_amount_units`.
                  Reporting amendment rates supports transparency in nutrient management and allows estimation of organic matter and nutrient contributions.
                definition: >
                  Specifies the quantity of an organic soil amendment applied to the field. This value should reflect the amount applied during a single application event.
                validation_guidance: >
                  - Must be a non-negative whole number.
                  - Represents the amount of organic or mineral amendment applied to the field.
                  - Interpretation depends on `amendment_type` and `amendment_amount_units`.
                  - Typical values range from 1 to 10 short tons per acre (2,000 to 20,000 pounds per acre).
                  - Values above 25,000 pounds (12.5 short tons) per acre are uncommon and should be reviewed for accuracy.
                  - When using volume-based units (e.g. `cubic_yards_per_acre`), verify appropriate density assumptions or conversions.
                numeric_id: 34
              - id: amendment_amount_units
                title: Amendment Amount Units
                data_type: enum
                section: soil
                group: organic_amendments
                parent_id: organic_amendments_applied
                required: false
                required_if:
                  field: amendment_amount
                  operator: value_present
                  value: true
                enum_select_mode: single
                valid_values:
                  - "`short_tons_per_acre`"
                  - "`long_tons_per_acre`"
                  - "`metric_tons_per_hectare`"
                  - "`cubic_yards_per_acre`"
                  - "`cubic_meters_per_hectare`"
                narration: >
                  This field defines the unit used to quantify the applied amendment, whether by weight or volume.

                  - Use `short_tons_per_acre` for U.S. customary tons (2,000 lb).
                  - Use `long_tons_per_acre` for British imperial tons (2,240 lb).
                  - Use `metric_tons_per_hectare` for international standard reporting.
                  - Use `cubic_yards_per_acre` for bulk volume-based applications in imperial systems.
                  - Use `cubic_meters_per_hectare` for volume-based applications in metric systems.

                  Accurate unit reporting ensures proper interpretation of amendment rates and supports analysis across regions and practices.
                definition: >
                  Specifies the unit of measure used to report the quantity of an organic amendment applied. Units are paired with either acres (imperial) or hectares (metric) depending on the
                  system.
                validation_guidance: >
                  - Valid values: `short_tons_per_acre`, `long_tons_per_acre`, `metric_tons_per_hectare`, `cubic_yards_per_acre`, `cubic_meters_per_hectare`.
                  - Required if `amendment_amount` is populated.
                  - Choose units appropriate to the local system and remain consistent within each record.
                  - Units should be compatible with the material type specified in `amendment_type` (e.g., use volume units for compost, mass units for lime).
                numeric_id: 35
              - id: amendment_application_date
                title: Amendment Application Date
                data_type: date
                section: soil
                group: organic_amendments
                parent_id: organic_amendments_applied
                required: false
                narration: >
                  This field helps document the timing of amendment applications relative to crop growth stages and harvest. Accurate timing supports interpretation of nutrient release
                  patterns, microbial activity, and potential effects on forage quality and yield.
                definition: >
                  Records the date when the organic amendment was applied to the field. This should correspond to a specific application event within the current hay crop cycle.
                validation_guidance: >
                  Must be formatted as `YYYYMMDD`.
                  Use `YYYYMM00` if day is unknown.
                  Use `YYYY0000` if both month and day are unknown.
                  Use `00000000` if no date is available or applicable.
                  Do not report dates prior to stand establishment.
                numeric_id: 36
    fields:
      - id: soil_test_date
        title: Soil Test Date
        data_type: date
        section: soil
        required: false
        narration: >
          Soil testing helps optimize fertilizer and lime application, supports environmental stewardship, and informs yield and quality expectations.

          This field enhances transparency in production and may support future traceability or certification requirements. When present, it may prompt systems to request additional data
          such as soil pH or nutrient inputs.
        definition: >
          Records the date of the most recent soil test used to guide nutrient and pH management decisions for the current hay crop.
        validation_guidance: >
          - Must be formatted as `YYYYMMDD`.
          - Use `YYYYMM00` if day is unknown.
          - Use `YYYY0000` if both month and day are unknown.
          - Use `00000000` if no date is available or applicable.
        numeric_id: 18
      - id: soil_test_ph
        title: Soil Test pH
        data_type: float
        section: soil
        required: false
        valid_range:
          min: 4
          max: 9
        narration: >
          Soil pH affects nutrient availability, microbial activity, and overall crop performance. Most forage crops perform best when soil pH is between 6.0 and 7.5. Legumes such as
          alfalfa benefit from pH levels above 6.5.

          This value should reflect a recent, lab-confirmed soil test. Buyers and agronomists may use this value to assess forage quality risk, nutrient uptake potential, and whether
          liming or fertility adjustments may have been needed.
        definition: >
          Records the pH of the soil based on the most recent test.
        validation_guidance: >
          - Must be a decimal between 4.0 and 9.0.
          - Represents soil pH from the most recent test.
          - Most forage crops perform best between 6.0 and 7.5.
          - Legumes like alfalfa prefer pH above 6.5.
          - Values below 5.0 or above 8.5 are uncommon and may require corrective amendments or retesting.
        numeric_id: 19
      - id: lime_applied
        title: Lime Applied
        data_type: enum
        section: soil
        required: false
        enum_select_mode: single
        valid_values:
          - "`true`"
          - "`false`"
          - "`unknown`"
        narration: >
          This field records whether lime was applied to adjust soil pH in support of forage growth.

          - `true` -- Lime was applied.
          - `false` -- No lime was applied.
          - `unknown` -- The seller is unsure or has not tested the soil.

          Liming improves nutrient availability and is especially important for legumes like alfalfa. Disclosure supports transparency in soil management and may affect how buyers
          interpret forage quality or root environment conditions.
        definition: >
          Indicates whether agricultural lime or another pH-adjusting amendment was applied to the field prior to or during the hay crop cycle.
        validation_guidance: >
          Valid values: `true`, `false`, `unknown`.
        numeric_id: 20
      - id: lime_application_date
        title: Lime Application Date
        data_type: date
        section: soil
        required: false
        narration: >
          Liming improves nutrient availability and overall forage productivity. This date helps contextualize pH-related values and supports transparency in soil fertility practices.
        definition: >
          Records the most recent date when lime was applied to adjust soil pH for the current hay crop.
        validation_guidance: >
          - Must be formatted as `YYYYMMDD`.
          - Use `YYYYMM00` if day is unknown.
          - Use `YYYY0000` if both month and day are unknown.
          - Use `00000000` if no date is available or applicable.
          - Do not report dates prior to stand establishment.
        numeric_id: 21
      - id: fertilizer_timing
        title: Fertilizer Application Timing
        data_type: group
        section: soil
        required: false
        narration: >
          This group tracks when nitrogen, potassium, and phosphorus fertilizers were applied. Application timing influences plant availability, leaching risk, and crop response. It also
          supports transparency in nutrient management practices and helps agronomists assess whether fertility schedules were aligned with crop demand.

          These dates contribute to understanding the relationship between nutrient supply and forage quality outcomes.
        definition: >
          Captures the dates on which key fertilizers were applied to the field during the growing season. Timing of application affects nutrient uptake efficiency, environmental risk,
          and alignment with plant growth stages.
        validation_guidance: >
          This is a structural field used to organize related fields into a logical group.

          - This field must have an empty `group` key.
          - All member fields should appear immediately after this group in the section.
          - Each member field must reference this group using the `group` key.
          - This field has a `data_type` of `group` and is used only for organizing related fields; it does not store data itself and should not appear in any dataset or form.

          Validation logic should ensure that grouped fields are present and correctly associated via the `group` key.
        numeric_id: 22
      - id: fertilizer_rates
        title: Fertilizer Application Rates
        data_type: group
        section: soil
        required: false
        narration: >
          This group documents how much nitrogen, potassium, and phosphorus was applied to the field. These rates are critical for understanding nutrient loading, optimizing yield, and
          interpreting lab-measured nutrient values in the harvested hay.

          Nutrient application levels also support evaluations of environmental impact, regulatory compliance, and alignment with production goals such as high-protein forage or soil
          stewardship.
        definition: >
          Specifies the quantity of primary fertilizers applied during the growing season. Rates are expressed in standardized mass units and help evaluate nutrient input levels.
        validation_guidance: >
          This is a structural field used to organize related fields into a logical group.

          - This field must have an empty `group` key.
          - All member fields should appear immediately after this group in the section.
          - Each member field must reference this group using the `group` key.
          - This field has a `data_type` of `group` and is used only for organizing related fields; it does not store data itself and should not appear in any dataset or form.

          Validation logic should ensure that grouped fields are present and correctly associated via the `group` key.
        numeric_id: 26
      - id: organic_amendments
        title: Organic Soil Amendments
        data_type: group
        section: soil
        required: false
        narration: >
          This group captures whether and how organic materials were applied to supplement or replace synthetic fertilizers. Common amendments include compost, manure, biosolids, or
          liquid organic nutrients. These practices affect nutrient cycling, microbial activity, and long-term soil structure.

          This information is useful for buyers concerned with sustainability, organic certification, or ecological farming practices.
        definition: >
          Describes the use of organic or biological soil amendments applied to the field, such as compost, manure, or microbial inoculants. These inputs influence soil health,
          fertility, and crop performance.
        validation_guidance: >
          This is a structural field used to organize related fields into a logical group.

          - This field must have an empty `group` key.
          - All member fields should appear immediately after this group in the section.
          - Each member field must reference this group using the `group` key.
          - This field has a `data_type` of `group` and is used only for organizing related fields; it does not store data itself and should not appear in any dataset or form.

          Validation logic should ensure that grouped fields are present and correctly associated via the `group` key.
        numeric_id: 31

  - id: stand
    title: Stand Composition and Agronomic Characteristics
    data_type: section
    required: true
    narration: >
      This section describes the planted forage stand -- the biological and agronomic foundation of the hay crop. It includes the intended composition of plant varieties, their
      representation in the harvested hay, and related agronomic details such as establishment method, density, and maturity at harvest.

      These fields support transparency around crop planning, species selection, and cultural practices, helping buyers assess the identity, uniformity, and development stage of the
      forage. The section also captures information relevant to quality, palatability, and intended use, and it helps agricultural professionals interpret how the hay's characteristics
      relate to field management decisions.
    definition: >
      Describes the agronomic characteristics of the hay stand at the time of harvest, including species composition, maturity, establishment method, and density. Helps contextualize
      forage quality and production conditions.
    numeric_id: 37
    fields:
      - id: stand_mixture_intended
        title: Stand Mixture Intended
        data_type: boolean
        section: stand
        required: false
        narration: >
          A value of `true` indicates the intention to grow a mix of species or varieties; a value of `false` indicates a monoculture was intended.

          This field captures grower intent and does not reflect the final outcome, which may differ due to environmental or agronomic factors. For example, a grower may plant an
          alfalfa/timothy mix, but only the timothy survives to harvest. This field would still be `true`.

          It pairs with `forage_species_type`, which records the actual composition of the harvested hay, and with `forage_variety_components`, which captures intended variety-level
          contributions.
        definition: >
          Expresses whether the grower intended to plant a mixed stand (polyculture) or a pure stand (monoculture) of forage species.
        validation_guidance: >
          Valid values: `true`, `false`.
        numeric_id: 38
      - id: forage_species_type
        title: Forage Species Type
        data_type: enum
        section: stand
        required: true
        enum_select_mode: single
        valid_values:
          - "`grass`"
          - "`legume`"
          - "`grass_legume_mix`"
          - "`other`"
        narration: >
          This field reflects the actual or observed composition of the forage at harvest, not the grower's original intent.

          - `grass` -- The hay consists primarily of grasses, such as bermudagrass or orchardgrass.
          - `legume` -- The hay consists primarily of legumes, such as alfalfa or clover.
          - `grass_legume_mix` -- Both grasses and legumes are present in significant proportion.
          - `other` -- The forage does not fit into the above categories (e.g., brassicas, forbs, or specialty hays).
          - `unknown` -- The dominant species type cannot be determined.

          This classification supports nutritional modeling, ration formulation, and marketing. It complements stand_mixture_intended.
        definition: >
          Describes the biological classification of the forage species present in the hay at harvest.
        validation_guidance: >
          Valid values: `grass`, `legume`, `grass_legume_mix`, `other`, `unknown`.
        numeric_id: 39
      - id: forage_variety_count
        title: Forage Variety Count
        data_type: int
        section: stand
        required: true
        valid_range:
          min: 1
          max: 10
        narration: >
          This field supports both marketing claims (e.g., "two-variety blend") and technical purposes, such as determining how many instances of a `forage_variety_components` block will
          be included in a structured message.

          It reflects the actual harvest outcome, not the grower's intent. In a pure crop, this field should be `1`. In a mixed crop, it should be `2` or more. If no species or varieties
          can be positively identified, use `0` and set `forage_species_type` to unknown.

          System validations may check for consistency across `stand_mixture_intended`, `forage_variety_count`, and any listed `forage_variety_components` entries.
        definition: >
          Reports how many distinct forage varieties were identified in the actual harvested crop.
        validation_guidance: >
          - Must be a whole number between 1 and 10.
          - Indicates the number of distinct forage varieties intentionally included in the stand..
          - Most fields contain 1 to 4 varieties; values above 5 are uncommon and should be confirmed.
        cross_field_consistency: >
          If forage_variety_count is 0, forage_species_type should be set to "unknown"
          If stand_mixture_intended is false, forage_variety_count should be 1
          If forage_variety_components are listed, the count should match this number
        numeric_id: 40
      - id: stand_composition
        title: Stand Composition
        data_type: group
        section: stand
        required: false
        narration: >
          This group captures both the planned and observed composition of the forage crop in terms of species and varieties. It includes the type of forage (e.g., grass, legume, or
          mixture), the number and names of varieties present, and estimates of each variety's representation in the harvested hay.

          These details are essential for understanding the genetic and agronomic foundation of the hay, evaluating consistency across lots, and assessing traits such as digestibility,
          palatability, and market suitability.
        definition: >
          Describes the intended and actual botanical composition of the forage stand at the time of harvest, including species type, number of varieties, and estimated representation in
          the harvested hay.
        validation_guidance: >
          This is a structural field used to organize related fields into a logical group.

          - This field must have an empty `group` key.
          - All member fields should appear immediately after this group in the section.
          - Each member field must reference this group using the `group` key.
          - This field has a `data_type` of `group` and is used only for organizing related fields; it does not store data itself and should not appear in any dataset or form.

          Validation logic should ensure that grouped fields are present and correctly associated via the `group` key.
        numeric_id: 41
      - id: forage_variety_components
        title: Forage Variety Components
        data_type: "object[]"
        section: stand
        required: true
        narration: >
          This component is used to represent individual forage varieties in the planted stand. Each entry reflects the grower's intention, the name of the variety, and its estimated
          contribution to the final harvested hay.

          Use one instance in a monoculture, or two or more in a polyculture. This component supports both agronomic analysis and marketplace transparency and is designed to align with
          `stand_mixture_intended` and `forage_variety_count`.
        definition: >
          Describes each intentionally planted forage variety in the hay sward, along with its intended contribution to the crop.
        validation_guidance: >
          - Include one entry for each forage variety intentionally seeded or established in the stand.
          - Each component must include a valid variety name, the intended contribution to the stand, and the estimated contribution to the harvested crop.
          - This component should align with `stand_mixture_intended` and `forage_variety_count`.
          - The internal fields `forage_variety`, `variety_representation_target`, and `variety_representation_result` each define their own validation logic.
        numeric_id: 42
        components:
          - id: forage_variety
            title: Forage Variety
            data_type: string
            section: stand
            group: stand_composition
            parent_id: forage_variety_components
            required: true
            valid_values_reference: "`hay_varieties_reference`"
            valid_values_additional: "`private_cultivar`"
            narration: >
              Must match an entry from the reference list of accepted hay varieties.
              Contact the publisher or consult the `hay_varieties_reference` for valid entries.
            definition: >
              Specifies the name of a forage variety intentionally included in the stand.
            validation_guidance: >
              - Must match an entry in the `hay_varieties_reference` list or be entered as free text.
              - If free text is used, spelling and capitalization should be consistent with known variety naming conventions.
              - Maximum length: 100 characters.
            numeric_id: 43
          - id: variety_representation_target
            title: Variety Representation Target
            data_type: int
            section: stand
            group: stand_composition
            parent_id: forage_variety_components
            required: true
            valid_range:
              min: 1
              max: 100
            narration: >
              This field captures the grower's intended composition of the stand by assigning a proportional weight to each variety in the mixture.

              If all varieties are intended to contribute equally, the same value can be used for each (e.g., 1, 1, 1). Interpretation depends on the distribution of values across all
              components in the same mixture.

              This proportional method enables flexible modeling of multi-variety stands without requiring percentages or strict totals.
            definition: >
              The grower's intended relative weight for this forage variety within the planted stand mixture.
            validation_guidance: >
              - Must be a whole number between 1 and 100.
              - Represents the relative proportion of this variety in the intended seed mix.
              - These values will be normalized across all varieties in the group to derive percentage-based contribution estimates.
              - Do not include varieties with a representation target of `0`.
            cross_field_consistency: >
              This value must be present for every listed forage_variety_component
              Interpretation depends on comparison with other component values in the same mixture
            numeric_id: 44
          - id: variety_representation_result
            title: Variety Representation Result
            data_type: float
            section: stand
            group: stand_composition
            parent_id: forage_variety_components
            required: true
            valid_range:
              min: 0
              max: 100
            narration: >
              This field represents the observed or estimated contribution of a specific forage variety to the harvested hay. Unlike the target value, this result is typically determined
              through visual inspection, post-harvest scouting, or lab analysis.

              It allows comparison between intended and actual stand outcomes and may inform future planning or support quality assurance and marketing claims.
            definition: >
              An estimate of the harvested contribution of this forage variety within the final hay crop, expressed as a percentage of total composition.
            validation_guidance: >
              - Must be a decimal between 0.0 and 100.0, or the string `unknown`.
              - Represents the estimated actual proportion of this variety in the mature stand.
              - Result values may differ from targets due to establishment variability, competition, or reseeding.
              - The total across all varieties should be approximately 100% when all components are known.
            cross_field_consistency: >
              Values across all forage_variety_components should total approximately 100
              May differ from variety_representation_target due to growth patterns, weather, or harvest dynamics
            numeric_id: 45
      - id: stand_maturity_at_harvest
        title: Stand Maturity At Harvest
        data_type: enum
        section: stand
        required: false
        enum_select_mode: single
        narration: >
          This field describes the developmental stage of the forage at cutting, which strongly influences nutritional value, fiber content, and palatability.

          Different species require different maturity scales. For example:

          - Grass hay may use stages such as boot, heading, or bloom.
          - Alfalfa may use scales like early bud, late bud, or full bloom.

          Accurate maturity assessment supports ration formulation and quality grading. This field is especially important for buyers evaluating feed value by cut stage.
        definition: >
          Records the predominant maturity stage of the forage stand at the time of harvest.
        validation_guidance: >
          Valid values must follow the appropriate maturity scale based on `forage_species_type`. See `conditional_enums` for species-specific lists.
        conditional_enums: >
          - `forage_species_type` = `grass` --> `vegetative`, `boot`, `heading`, `flowering`, `mature`, `other`, `unknown`.
          - `forage_species_type` = `legume` --> `early_bud`, `late_bud`, `early_bloom`, `full_bloom`, `post_bloom`, `other`, `unknown`.
          - `forage_species_type` = `grass_legume_mix` --> `early_bud`, `late_bud`, `boot`, `heading`, `early_bloom`, `full_bloom`, `flowering`, `mature`, `post_bloom`, `other`,
          `unknown`.
          - `forage_species_type` = `unknown` --> `early_bud`, `late_bud`, `boot`, `heading`, `early_bloom`, `full_bloom`, `flowering, mature`, `post_bloom`, `other`, `unknown`.
        numeric_id: 46
      - id: stand_establishment_method
        title: Stand Establishment Method
        data_type: enum
        section: stand
        required: false
        enum_select_mode: single
        valid_values:
          - "`drilled`"
          - "`broadcast`"
          - "`frost_seeded`"
          - "`interseeded`"
          - "`sprigged`"
          - "`no_till`"
          - "`unknown`"
        narration: >
          This field describes how the forage crop was initially planted or introduced to the field. Establishment method influences early growth, stand density, weed competition, and
          long-term productivity.

          Methods such as no-till and interseeding may signal conservation practices or attempts to preserve soil structure. Others, like drilling or sprigging, may be selected for
          precise seed placement or species-specific requirements.

          Understanding establishment technique supports agronomic evaluation and informs buyers about underlying crop management practices.
        definition: >
          Indicates the method used to establish the forage stand.
        validation_guidance: >
          Valid values: `drilled`, `broadcast`, `frost_seeded`, `interseeded`, `sprigged`, `no_till`, `unknown`.
        numeric_id: 47
      - id: stand_establishment_date
        title: Stand Establishment Date
        data_type: date
        section: stand
        required: false
        narration: >
          This field documents the establishment date of the forage stand. It supports evaluation of crop maturity, persistence, and expected performance.

          Stand age can influence forage yield, species balance, and susceptibility to weeds or weather stress. When the exact planting date is not known, placeholder values allow for
          approximate reporting.
        definition: >
          Records the date on which the forage stand was planted or sown.
        validation_guidance: >
          - Must be formatted as `YYYYMMDD`.
          - Use `YYYYMM00` if day is unknown.
          - Use `YYYY0000` if both month and day are unknown.
          - Use `00000000` if no date is available or applicable.
        numeric_id: 48
      - id: stand_density
        title: Stand Density
        data_type: enum
        section: stand
        required: false
        enum_select_mode: single
        valid_values:
          - "`sparse`"
          - "`moderate`"
          - "`dense`"
          - "`unknown`"
        narration: >
          This field reflects the observed thickness or ground coverage of the forage stand during harvest. Higher density often correlates with better yield potential, weed suppression,
          and regrowth vigor.

          - `sparse` -- Thin coverage with visible soil between plants.
          - `moderate` -- Typical field coverage with average uniformity.
          - `dense` -- Uniform and vigorous canopy with minimal gaps.
          - `unknown` -- Density not assessed or reported.

          Stand density is useful for agronomic analysis and helps contextualize forage quality, especially when paired with establishment method and species type.
        definition: >
          Qualitatively assesses the density of the forage stand at the time of harvest.
        validation_guidance: >
          Valid values: `sparse`, `moderate`, `dense`, `unknown`.
        numeric_id: 49
      - id: source_stand_age
        title: Source Stand Age
        data_type: int
        section: stand
        required: false
        valid_range:
          min: 0
          max: 50
        narration: >
          This field indicates how many full growing seasons the stand has been in production prior to harvest. For example, a first-year stand harvested in its establishment year should
          be recorded as `0`.

          Stand age influences productivity, species persistence, and nutrient requirements. Younger stands may yield differently or show more dominance from fast-establishing species,
          while older stands may thin out or shift in composition.

          This value helps buyers and agronomists interpret crop vigor and project future performance.
        definition: >
          Reports the age of the forage stand in completed growing seasons at the time of harvest.
        validation_guidance: >
          - Must be a whole number between 0 and 50.
          - Use `0` for new seedings not yet harvested.
          - For alfalfa, stand age typically ranges from 1 to 7 years.
          - For grass, well-managed stands may persist productively for 10 to 50 years or more.
        cross_field_consistency: >
          If stand_establishment_date is provided, this value should correspond to the elapsed time between establishment and harvest
          Often used in combination with stand_density and maturity to assess overall stand condition
        numeric_id: 50

  - id: crop_management
    title: In-Season Crop Management
    data_type: section
    required: true
    narration: >
      This section documents how the hay crop was managed during the growing season -- including cutting strategy, weed and pest management, and other contextual information such as
      weather stresses or field notes.

      These details help buyers and agronomists evaluate how active crop management may have influenced the resulting forage quality, consistency, and marketability.
    definition: >
      Documents key management practices during the growing season, including irrigation, fertilization, pest and weed control, and field scouting. These inputs influence yield,
      quality, and safety.
    numeric_id: 51
    fields:
      - id: growth_conditions_notes
        title: Growth Conditions Notes
        data_type: string
        section: crop_management
        required: false
        narration: >
          This field allows producers to disclose unusual or noteworthy environmental factors that may have affected yield, quality, or field performance. Example entries:

          - Light drought stress during early growth; recovered by late season.
          - Localized hail damage in May.
          - Flooded low areas did not contribute to harvest.

          This information is optional but may support transparency in high-trust markets, niche quality claims, or export documentation.
        definition: >
          Optional field for describing notable growing conditions that may have impacted the hay crop, such as drought, flooding, hail, or heat stress.
        validation_guidance: >
          Optional free-text description of weather, irrigation, or growing conditions. Maximum 500 characters.
        numeric_id: 52
      - id: weed_pressure_observed
        title: Weed Pressure Observed
        data_type: enum
        section: crop_management
        required: true
        enum_select_mode: single
        valid_values:
          - "`none`"
          - "`low`"
          - "`moderate`"
          - "`high`"
          - "`unknown`"
        narration: >
          This field supports transparency and may inform eligibility for certified weed free programs or affect buyer preferences.
          - `none` -- No visible weed pressure; stand appears clean and uniform.
          - `low` -- Minor weed presence; unlikely to affect palatability or marketability.
          - `moderate` -- Noticeable weed presence; may influence feed value or buyer preference.
          - `high` -- Significant weed presence; likely to reduce market value or trigger restrictions.
          - `unknown` -- Seller does not know or declined to report.
        definition: >
          Estimates the level of weed presence in the field during the growing season.
        validation_guidance: >
          Valid values: `none`, `low`, `moderate`, `high`, `unknown`.
        numeric_id: 53
      - id: hay_herbicide_treated
        title: Hay Herbicide Treated
        data_type: enum
        section: crop_management
        required: true
        enum_select_mode: single
        valid_values:
          - "`true`"
          - "`false`"
          - "`unknown`"
        narration: >
          Herbicide use may influence weed pressure, forage purity, and chemical residue risk.
          - `true` -- Herbicides were used.
          - `false` -- No herbicides were applied.
          - `unknown` -- Seller does not know or does not wish to disclose.
        definition: >
          Discloses whether herbicides were applied to the source field(s) during the growing season.
        validation_guidance: >
          Valid values: `true`, `false`, `unknown`.
        numeric_id: 54
      - id: glyphosate_application_status
        title: Glyphosate Application Status
        data_type: enum
        section: crop_management
        required: false
        enum_select_mode: single
        valid_values:
          - "`not_applied`"
          - "`applied_pre_emergence_only`"
          - "`applied_pre_harvest`"
          - "`applied_to_forage_crop`"
          - "`unknown`"
        narration: >
          This field allows sellers to disclose whether glyphosate was used during the production of the hay crop and, if so, at what stage. Glyphosate is widely used in conventional
          agriculture but is subject to special scrutiny in certain markets, especially for horse hay, organic programs, and export. This disclosure helps buyers assess potential
          concerns related to herbicide residue, crop termination practices, and regulatory compliance. The field distinguishes between early-season (pre-emergence) and late-season (pre-
          harvest or crop-directed) applications to provide additional transparency.
        definition: >
          Indicates whether glyphosate was applied during the crops production cycle, and if so, at what stage. Pre-emergence refers to application before forage germination or regrowth.
          Pre-harvest refers to application shortly before cutting. Application to the forage crop includes any use where glyphosate made direct contact with marketable plant tissue,
          including to accelerate dry-down.
        validation_guidance: >
          - Must be one of the following values: `not_applied`, `applied_pre_emergence_only`, `applied_pre_harvest`, `applied_to_forage_crop`, or `unknown`.
          - If `applied_to_forage_crop`, disclosure of glyphosate residue testing or potential market restrictions may be warranted, especially for export, equine, or organic-sensitive
          buyers.
        cross_field_consistency: >
          - If `hay_herbicide_treated` is `false`, then `glyphosate_application_status` should be `not_applied`.
          - If `hay_herbicide_treated` is `unknown`, then `glyphosate_application_status` should be `unknown`.
        numeric_id: 55
      - id: pest_pressure_observed
        title: Pest Pressure Observed
        data_type: enum
        section: crop_management
        required: true
        enum_select_mode: single
        valid_values:
          - "`none`"
          - "`low`"
          - "`moderate`"
          - "`high`"
          - "`unknown`"
        narration: >
          This field helps assess environmental stress and potential yield or quality loss due to pest activity.
          - `none` -- No notable pest activity.
          - `low` -- Minor pest presence; little or no impact.
          - `moderate` -- Noticeable pest presence; some impact on leaf loss, yield, or quality.
          - `high` -- Major pest infestation likely to affect quality or marketability.
          - `unknown` -- Seller does not know or declined to report.

          Common pests may include aphids, armyworms, leafhoppers, or weevils.
        definition: >
          Reports the level of pest pressure observed during the growing season.
        validation_guidance: >
          Valid values: `none`, `low`, `moderate`, `high`, `unknown`.
        numeric_id: 56
      - id: hay_pesticide_treated
        title: Hay Pesticide Treated
        data_type: enum
        section: crop_management
        required: true
        enum_select_mode: single
        valid_values:
          - "`true`"
          - "`false`"
          - "`unknown`"
        narration: >
          This field is important for organic compliance, residue monitoring, and protection of sensitive livestock species.
          - `true` -- One or more pesticide treatments were applied.
          - `false` -- No pesticide treatments were applied.
          - `unknown` -- Seller does not know or does not wish to disclose.
        definition: >
          Discloses whether pesticides (excluding herbicides) such as insecticides, fungicides, or miticides were applied to the hay crop during the growing season.
        validation_guidance: >
          Valid values: `true`, `false`, `unknown`.
        numeric_id: 57
      - id: hay_preservative_applied
        title: Hay Preservative Applied
        data_type: enum
        section: crop_management
        required: true
        enum_select_mode: single
        valid_values:
          - "`true`"
          - "`false`"
          - "`unknown`"
        narration: >
          Preservatives are used to inhibit mold growth and improve storability, especially for hay baled at higher moisture levels.
          - `true` -- A preservative was applied.
          - `false` -- No preservative was used.
          - `unknown` -- Seller does not know or does not wish to disclose.
        definition: >
          Indicates whether a preservative -- such as propionic acid -- was applied to the hay during harvest or storage.
        validation_guidance: >
          Valid values: `true`, `false`, `unknown`.
        numeric_id: 58
      - id: hay_coloring_agent_used
        title: Hay Coloring Agent Used
        data_type: enum
        section: crop_management
        required: true
        enum_select_mode: single
        valid_values:
          - "`true`"
          - "`false`"
          - "`unknown`"
        narration: >
          Coloring agents do not affect nutritional value but may influence buyer perception or market suitability.
          - `true` -- A coloring agent was used.
          - `false` -- No coloring agent was applied.
          - `unknown` -- Seller does not know or does not wish to disclose.
        definition: >
          Indicates whether a coloring agent was applied to the hay for cosmetic or marketing purposes.
        validation_guidance: >
          Valid values: `true`, `false`, `unknown`.
        numeric_id: 59
      - id: cutting_regimen_usual
        title: Cutting Regimen Usual
        data_type: int
        section: crop_management
        required: false
        valid_range:
          min: 1
          max: 10
        narration: >
          This field provides context about how intensively the forage stand is typically harvested. The number of cuttings reflects long-term grower practice and is influenced by
          factors such as crop species, climate, irrigation availability, and management goals. It offers insight into stand productivity, regrowth cycles, and how frequently the crop is
          removed during the growing season.
        definition: >
          Represents the grower's customary number of hay cuttings per growing season, based on long-term practice with this stand or forage type.
        validation_guidance: >
          - Must be a whole number between 1 and 10.
          - Represents the typical number of cuttings per year for this field.
          - Most grass systems range from 2 to 4 cuttings.
          - Alfalfa systems typically support 3 to 7 cuttings.
          - Values above 7 are rare and may reflect subtropical climates or intensive irrigation.
        numeric_id: 60
      - id: cutting_stage_target
        title: Cutting Stage Target
        data_type: enum
        section: crop_management
        required: false
        enum_select_mode: single
        narration: >
          Cutting stage affects forage quality by influencing fiber content, digestibility, and nutritional density. Targeting the right stage helps producers meet buyer expectations and
          balance yield versus quality.
        definition: >
          Indicates the growth stage at which the grower typically aims to cut hay for optimal quality and yield. This is a reported target, not the measured maturity at harvest.
        validation_guidance: >
          Valid values depend on `forage_species_type`. See `conditional_enums` for allowable cutting stage targets.
        conditional_enums: >
          - `forage_species_type` = `grass` --> `vegetative`, `boot`, `heading`, `flowering`, `mature`, `other`, `unknown`.
          - `forage_species_type` = `legume` --> `early_bud`, `late_bud`, `early_bloom`, `full_bloom`, `post_bloom`, `other`, `unknown`.
          - `forage_species_type` = `grass_legume_mix` --> `early_bud`, `late_bud`, `boot`, `heading`, `early_bloom`, `full_bloom`, `flowering`, `mature`, `post_bloom`, `other`,
          `unknown`.
          - `forage_species_type` = `unknown` --> `early_bud`, `late_bud`, `boot`, `heading`, `early_bloom`, `full_bloom`, `flowering, mature`, `post_bloom`, `other`, `unknown`.
        numeric_id: 61

  - id: harvest
    title: Harvest-Level Data
    data_type: section
    required: true
    narration: >
      This section documents key facts about the harvest event or events from which the hay was produced.

      It includes cutting number, harvest dates, field yield, and average bale weight -- along with indicators of harvest-specific practices such as conditioning.

      These fields provide crucial context for traceability, logistics, and quality interpretation, especially when evaluating consistency across lots, seasons, or producers.

      Accurate reporting of this data supports both market transparency and informed decision-making by buyers and nutritionists.
    definition: >
      Records field-level harvest details including cutting, baling, conditioning, moisture at baling, and other time-sensitive actions. Provides context for forage quality and shelf
      life.
    numeric_id: 62
    fields:
      - id: harvest_date_start
        title: Harvest Date Start
        data_type: datetime
        section: harvest
        required: false
        narration: >
          Records the initiation of harvesting operations for the hay lot. This date-time value marks when cutting began.

          - Used in conjunction with `harvest_date_end` to provide temporal context for evaluating curing conditions, weather exposure, and alignment with agronomic plans.
          - Especially relevant for traceability, quality assessment, and aligning with records of field operations.
        definition: >
          Represents the commencement date and time of the hay harvest, typically corresponding to the mowing date.
        validation_guidance: >
          - Must be formatted as `YYYYMMDDHHMM`.
          - Use zero placeholders for unknown values in the datetime sequence. For example, if only year, month, and date are known, use `YYMMDD0000`.
          - This date helps consumers understand the age of the hay, its seasonal timing, and local weather correlations.
          - Must precede `harvest_date_end`.
        cross_field_consistency: >
          If hay_single_lot_traceable is true, the span between harvest_date_start and harvest_date_end must not exceed 48 hours.
        numeric_id: 63
      - id: harvest_date_end
        title: Harvest Date End
        data_type: datetime
        section: harvest
        required: false
        narration: >
          Records the conclusion of harvesting operations for the hay lot. This date-time value marks when bales were removed from the field for storage.

          - Used in conjunction with `harvest_date_start` to establish the full harvest window, evaluate drying time, and align with storage, logistics, or inspection records.
          - Important for assessing exposure risks and confirming lot closure for traceability and documentation.
        definition: >
          Represents the conclusion date and time of the hay harvest, typically corresponding to the baling date.
        validation_guidance: >
          - Must be formatted as `YYYYMMDDHHMM`.
          - Use zero placeholders for unknown values in the datetime sequence. For example, if only year, month, and date are known, use `YYYYMMDD0000`.
          - Must not precede `harvest_date_start`.
        cross_field_consistency: >
          If hay_single_lot_traceable is true, the span between harvest_date_start and harvest_date_end must not exceed 48 hours.
        numeric_id: 64
      - id: hay_cutting
        title: Hay Cutting
        data_type: int
        section: harvest
        required: false
        valid_range:
          min: 1
          max: 10
        narration: >
          This field provides context about the seasonal stage of production. Cutting number can influence maturity, nutrient profile, and buyer expectations. Earlier cuttings are often
          leafier and higher in digestibility, while later cuttings may offer higher yield or more fiber.
        definition: >
          Indicates which cutting of the season produced this hay (e.g., 1 for first cutting, 2 for second cutting).
        validation_guidance: >
          - Must be a whole number between 1 and 10.
          - Indicates which cutting this hay lot came from during the current production season.
          - Values typically range from 1 to 4 in most systems.
          - Values above 6 are uncommon and usually reflect alfalfa grown under high-intensity or extended-season management.
        numeric_id: 65
      - id: baler_moisture_average
        title: Baler Moisture Average
        data_type: float
        section: harvest
        required: false
        valid_range:
          min: 6
          max: 30
        narration: >
          This value reflects in-field moisture conditions during baling. It helps assess spoilage risk, guide storage practices, and indicate whether preservative use may have been
          necessary. Values above approximately 18.0 percent may indicate elevated risk of mold or heating if no preservative was applied.
        definition: >
          Records the average hay moisture content at harvest, based on baler sensor data.
        validation_guidance: >
          - Must be a decimal between 6.0 and 30.0.
          - Represents the average moisture content measured by the baler at the time of harvest.
          - Target baling moisture is typically between 12.0 and 18.0 percent depending on bale type.
          - Values below 10.0 may indicate overdrying.
          - Values above 20.0 may increase the risk of mold or heating in storage.
        numeric_id: 66
      - id: baler_moisture_high
        title: Baler Moisture High
        data_type: float
        section: harvest
        required: false
        valid_range:
          min: 6
          max: 40
        narration: >
          This field helps identify zones of elevated spoilage risk due to high moisture. When used alongside `baler_moisture_average`, it provides insight into variability across the
          lot. Values above 18.0 percent may signal increased risk of mold growth or internal heating during storage.
        definition: >
          Records the highest observed hay moisture content at harvest, based on readings from baling equipment sensors.
        validation_guidance: >
          - Must be a decimal between 6.0 and 40.0.
          - Represents the highest moisture reading recorded by the baler during this cutting.
          - Values above 20.0 percent increase the risk of mold, spoilage, or internal heating.
          - Values above 30.0 are rare and should be confirmed for accuracy or adjusted if using preservatives.
        numeric_id: 67
      - id: hay_conditioned
        title: Hay Conditioned
        data_type: enum
        section: harvest
        required: true
        enum_select_mode: single
        valid_values:
          - "`true`"
          - "`false`"
          - "`unknown`"
        narration: >
          Conditioning accelerates drying and helps reduce nutrient loss from weathering. This practice can improve drying uniformity, reduce leaf loss, and enhance forage quality,
          particularly in legumes.
        definition: >
          Indicates whether hay was mechanically conditioned (e.g., crimped or crushed) during harvest.
        validation_guidance: >
          - Valid values: `true`, `false`, `unknown`.
          - If the hay was not mechanically conditioned, the `false` value should be selected.
          - If conditioning status is not documented or unclear, use `unknown`.
        numeric_id: 68
      - id: bale_weight_intended
        title: Bale Weight Intended
        data_type: int
        section: harvest
        required: false
        valid_range:
          min: 9
          max: 3000
        narration: >
          This value reflects the intended bale weight based on baler settings, grower preference, or market expectations. It helps buyers understand packaging consistency and logistical
          factors even if actual bale weights vary.
        definition: >
          Targeted average bale weight set on the baler or planned by the grower before or during harvest.
        validation_guidance: >
          - Must be a whole number representing the target or planned bale weight in the units specified by `bale_weight_units`.
          - Typical weight ranges by bale type and units:
          - `small_square`: 4080 lb or 1836 kg
          - `large_round`: 8001600 lb or 360730 kg
          - `large_square`: 10002000 lb or 450900 kg
          - Values above 2500 lb or 1100 kg are uncommon and should be confirmed for accuracy or bale type.
        cross_field_consistency: >
          - If `bale_shape` is `small_square`, then `bale_weight_intended` should typically be 4080 lb or 1836 kg.
          - If `bale_shape` is `large_round`, then `bale_weight_intended` should typically be 8001600 lb or 360730 kg.
          - If `bale_shape` is `large_square`, then `bale_weight_intended` should typically be 10002000 lb or 450900 kg.
          - If `bale_weight_units` is `kilograms`, ranges should be interpreted in kilograms.
        numeric_id: 69
      - id: average_bale_weight
        title: Average Bale Weight
        data_type: int
        section: harvest
        required: true
        valid_range:
          min: 9
          max: 3000
        narration: >
          This value represents the typical bale weight achieved in the lot. It may be derived from scale measurements, estimates, or equipment data. Accurate reporting supports
          inventory tracking, logistics, and buyer planning.
        definition: >
          Average weight of the bales in the lot, either measured or estimated.
        validation_guidance: >
          - Must be a whole number representing the measured or estimated average weight of bales in this lot, using the units specified by `bale_weight_units`.
          - Typical weight ranges by bale type and units:
          - `small_square`: 4080 lb or 1836 kg
          - `large_round`: 8001600 lb or 360730 kg
          - `large_square`: 10002000 lb or 450900 kg
          - Values above 2500 lb or 1100 kg are uncommon and should be reviewed for accuracy or special packing conditions.
        cross_field_consistency: >
          - If `bale_shape` is `small_square`, then `average_bale_weight` should typically be 4080 lb or 1836 kg.
          - If `bale_shape` is `large_round`, then `average_bale_weight` should typically be 8001600 lb or 360730 kg.
          - If `bale_shape` is `large_square`, then `average_bale_weight` should typically be 10002000 lb or 450900 kg.
          - If `bale_weight_units` is `kilograms`, ranges should be interpreted in kilograms.
        numeric_id: 70
      - id: bale_weight_assessment_method
        title: Bale Weight Assessment Method
        data_type: enum
        section: harvest
        required: true
        enum_select_mode: single
        valid_values:
          - "`truckload_average`"
          - "`explicit_weight`"
          - "`baler_target`"
          - "`grower_estimate_uniform_bales`"
          - "`grower_estimate_disparate_bales`"
        narration: >
          This field clarifies how the average bale weight was determined, supporting transparency for buyers, inventory tracking, and pricing accuracy.
          - `truckload_average`  Based on dividing a known truckload weight by bale count.
          - `explicit_weight`  Directly measured on a certified or calibrated scale.
          - `baler_target`  Based on baler configuration or intended setting.
          - `grower_estimate_uniform_bales`  Visual or experiential estimate assuming bales are similar in size.
          - `grower_estimate_disparate_bales`  Estimate based on variable bale sizes, possibly with added adjustments.
        definition: >
          Specifies the method used to determine the reported average bale weight.
        validation_guidance: >
          Valid values: `truckload_average`, `explicit_weight`, `baler_target`, `grower_estimate_uniform_bales`, `grower_estimate_disparate_bales`.
        numeric_id: 71
      - id: bale_count
        title: Bale Count
        data_type: int
        section: harvest
        required: false
        valid_range:
          min: 1
          max: 100000
        narration: >
          Bale count is essential for calculating inventory, estimating total yield, and planning logistics. It also supports traceability and reconciliation with weight-based yield
          figures when combined with average bale weight.
        definition: >
          Total number of bales produced for this hay lot.
        validation_guidance: >
          - Must be a whole number between 1 and 100000.
          - Represents the total number of bales produced for this hay lot.
          - Typical field lots contain 50 to 5000 bales depending on bale size and acreage.
          - Values above 10000 are common in large-scale operations.
          - Values above 50000 should be reviewed for inventory or entry error.
        numeric_id: 72
      - id: source_field_yield
        title: Source Field Yield
        data_type: int
        section: harvest
        required: false
        valid_range:
          min: 0.1
          max: 100
        narration: >
          This value helps assess field productivity, support inventory reconciliation, and enable comparisons across seasons, stands, or practices. It may be measured or estimated, but
          should align with the declared units for clarity and consistency.
        definition: >
          Total yield, expressed as a weight, from the source field or combined fields that produced this hay.
        validation_guidance: >
          - Must be a positive decimal between 0.1 and 100.0.
          - Represents the total yield from the source field for this hay lot.
          - Interpretation depends on `source_field_yield_units`.
          - Typical hay yields range from 0.5 to 8.0 tons per acre per cutting.
          - Values above 50 tons may reflect total across multiple fields or unusually large-scale production.
        numeric_id: 73
      - id: source_field_yield_units
        title: Source Field Yield Units
        data_type: enum
        section: harvest
        required: false
        required_if:
          field: source_field_yield
          operator: value_present
          value: true
        enum_select_mode: single
        valid_values:
          - "`metric_tons`"
          - "`british_long_tons`"
          - "`us_short_tons`"
        narration: >
          This field defines how the yield value is expressed.
          - `metric_tons`  1,000 kilograms (approximately 2,204.62 pounds).
          - `british_long_tons`  2,240 pounds.
          - `us_short_tons`  2,000 pounds.
          Consistent and accurate unit reporting ensures comparability across records and supports correct interpretation of total yield, logistics, and pricing.
        definition: >
          Specifies the unit of measure used to report the total field yield in `source_field_yield`.
        validation_guidance: >
          - Valid values: `metric_tons`, `british_long_tons`, `us_short_tons`.
          - Required if `source_field_yield` is populated.
        numeric_id: 74

  - id: packaging
    title: Hay Packaging
    data_type: section
    required: true
    narration: >
      This section describes the physical form in which the hay is currently packaged for sale or shipment. It includes bale dimensions, binding material, compression method, and other
      packaging details that affect storage, transport, handling, and customer preferences.

      Packaging specifications may differ from original harvest conditions -- particularly in cases where hay has been rebaled or processed after the initial cutting. Buyers rely on this
      data to assess compatibility with feeding systems, freight capacity, and regulatory or market requirements.

      Note: Some hay may be reprocessed or rebaled after the initial harvest. Fields in this section (including weight, shape, and compression) describe the hay as currently packaged
      for sale or shipment -- which may differ from the original harvest form.
    definition: >
      Describes how the hay was packaged, including bale type, dimensions, wrapping materials, and labeling. Essential for logistics, compatibility with handling equipment, and product
      identification.
    numeric_id: 75
    fields:
      - id: hay_packaging_history
        title: Hay Packaging History
        data_type: enum
        section: packaging
        required: true
        enum_select_mode: single
        valid_values:
          - "`original`"
          - "`rebaled`"
          - "`repackaged`"
          - "`compressed`"
          - "`unknown`"
        narration: >
          This field provides a simple disclosure of whether the hay has been handled beyond its original bale form.
          - `original`  Packaged only once, as initially baled.
          - `rebaled`  Removed from original bale and baled again without major format change.
          - `repackaged`  Converted to a different bale format (e.g., large square to small square).
          - `compressed`  Compressed for storage, containerization, or export.
          - `unknown`  Packaging history not disclosed or not recorded.
        definition: >
          Indicates whether the hay has undergone any additional packaging processes after its initial baling.
        validation_guidance: >
          Valid values: `original`, `rebaled`, `repackaged`, `compressed`, `unknown`.
        numeric_id: 76
      - id: bale_weight_intended_repackaged
        title: Bale Weight Intended Repackaged
        data_type: int
        section: packaging
        required: false
        valid_range:
          min: 20
          max: 3000
        narration: >
          This value reflects the grower's or processor's target weight for bales after any post-harvest handling. It supports clarity in retail, export, or rebaled contexts and helps
          reconcile physical inventory and pricing.
        definition: >
          Represents the intended weight of each bale in its final, repackaged form.
        validation_guidance: >
          - Must be a whole number between 20 and 3000.
          - Represents the intended weight per bale after repackaging, in the units defined by `bale_weight_units`.
          - This may differ from original bale weights due to resizing or compression for shipping.
          - Typical values follow the same range as original bale weights.
          - Values above 2500 may indicate special handling or export requirements and should be reviewed for accuracy.
        numeric_id: 77
      - id: bale_weight_units
        title: Bale Weight Units
        data_type: enum
        section: packaging
        required: true
        enum_select_mode: single
        valid_values:
          - "`kilograms`"
          - "`pounds`"
        narration: >
          This field defines the unit system used for both `bale_weight_intended` and `average_bale_weight`, as well as `bale_weight_intended_repackaged` if applicable.
          - `pounds`  Commonly used in the United States.
          - `kilograms`  Standard in most international markets.
          Consistent unit usage supports accurate interpretation, trade, and conversion across systems.
        definition: >
          Specifies the unit of measure used for reporting bale weights.
        validation_guidance: >
          Valid values: `pounds`, `kilograms`.
        numeric_id: 78
      - id: bale_binding_material
        title: Bale Binding Material
        data_type: enum
        section: packaging
        required: true
        enum_select_mode: single
        valid_values:
          - "`plastic_twine`"
          - "`sisal_twine`"
          - "`wire`"
          - "`net_wrap`"
          - "`plastic_strap`"
          - "`other`"
          - "`unknown`"
        narration: >
          Binding material influences handling, market acceptance, and environmental impact.
          - `plastic_twine`  Synthetic twine commonly used in modern baling.
          - `sisal_twine`  Natural fiber twine, biodegradable and often preferred in sensitive markets.
          - `wire`  Metal wire, typically used for compressed or export bales.
          - `net_wrap`  Plastic mesh wrap, common for round bales.
          - `plastic_strap`  Rigid synthetic strapping used for compressed or high-density bales.
          - `other`  Material not listed.
          - `unknown`  Binding material not known or not disclosed.
        definition: >
          Identifies the primary material used to bind or secure the hay bale.
        validation_guidance: >
          Valid values: `plastic_twine`, `sisal_twine`, `wire`, `net_wrap`, `plastic_strap`, `other`, `unknown`.
        numeric_id: 79
      - id: bale_binding_details
        title: Bale Binding Details
        data_type: enum
        section: packaging
        required: true
        enum_select_mode: single
        valid_values:
          - "`small_two_strand`"
          - "`small_three_strand`"
          - "`large_3x3x8`"
          - "`large_3x4x8`"
          - "`large_4x4x8`"
          - "`round_twine`"
          - "`round_net_wrap`"
          - "`round_plastic_wrap`"
          - "`other`"
        narration: >
          This field helps buyers and logistics personnel understand the bale's form factor and binding configuration.
          - `small_two_strand`  Small rectangular bale bound with two strands of twine.
          - `small_three_strand`  Small rectangular bale bound with three strands of twine.
          - `large_3x3x8`  Large square bale approximately 3x3x8 feet.
          - `large_3x4x8`  Large square bale approximately 3x4x8 feet.
          - `large_4x4x8`  Large square bale approximately 4x4x8 feet.
          - `round_twine`  Round bale secured with twine.
          - `round_net_wrap`  Round bale secured with net wrap.
          - `round_plastic_wrap`  Round bale wrapped entirely in plastic film.
          - `other`  Format not listed.
        definition: >
          Specifies the bale format and associated binding configuration, typically used to describe the physical structure and handling characteristics of the bale.
        validation_guidance: >
          Valid values: `small_two_strand`, `small_three_strand`, `large_3x3x8`, `large_3x4x8`, `large_4x4x8`, `round_twine`, `round_net_wrap`, `round_plastic_wrap`, `other`.
        numeric_id: 80
      - id: hay_compression
        title: Hay Compression
        data_type: enum
        section: packaging
        required: true
        enum_select_mode: single
        valid_values:
          - "`none`"
          - "`single_compressed`"
          - "`double_compressed`"
          - "`unknown`"
        narration: >
          Compression affects bale density, handling requirements, and suitability for export.
          - `none`  No mechanical compression beyond original baling.
          - `single_compressed`  Compressed once after initial baling.
          - `double_compressed`  Compressed twice, often for export or containerization.
          - `unknown`  Compression status not known or not disclosed.
        definition: >
          Indicates whether the hay has been mechanically compressed after baling to reduce volume or facilitate transport.
        validation_guidance: >
          Valid values: `none`, `single_compressed`, `double_compressed`, `unknown`.
        numeric_id: 81
      - id: bale_shape
        title: Bale Shape
        data_type: enum
        section: packaging
        required: true
        enum_select_mode: single
        valid_values:
          - "`small_rectangular`"
          - "`large_rectangular`"
          - "`round`"
          - "`other`"
        narration: >
          Bale shape affects stacking, handling equipment, and compatibility with transportation systems.
          - `small_rectangular`  Typically hand-stacked, manageable by one person.
          - `large_rectangular`  Mechanically handled, often used in commercial operations or export.
          - `round`  Cylindrical bales rolled in the field, often net or twine-wrapped.
          - `other`  Shape not listed.
        definition: >
          Specifies the general shape or geometry of the bale.
        validation_guidance: >
          Valid values: `small_rectangular`, `large_rectangular`, `round`, `other`.
        numeric_id: 82
      - id: bale_dimension_width
        title: Bale Dimension Width
        data_type: float
        section: packaging
        required: false
        valid_range:
          min: 13
          max: 250
        narration: >
          For rectangular bales, width is defined as the second-longest side. This approach ensures consistency regardless of bale orientation during storage or transport. Used together
          with length and height, this field supports volume calculations, space planning, and equipment compatibility.
        definition: >
          Specifies the intermediate dimension of a rectangular bale, based on the relative length of its sides.
        validation_guidance: >
          - Must be a decimal number between 13.0 and 250.0.
          - Units are defined by `bale_dimension_units`.
          - Applies only to bales with `bale_shape` of `small_rectangular` or `large_rectangular`.
          - Typical width values for small rectangular bales range from 14 to 18 inches (36 to 46 cm); large bales may range from 32 to 48 inches (81 to 122 cm).
          - For round bales, this field should be left blank or omitted.
        numeric_id: 83
      - id: bale_dimension_height
        title: Bale Dimension Height
        data_type: float
        section: packaging
        required: false
        valid_range:
          min: 13
          max: 250
        narration: >
          For rectangular bales, height is defined as the shortest of the three sides. This standardized interpretation improves consistency in documenting bale geometry and supports
          accurate modeling of stack height and loading patterns.
        definition: >
          Specifies the shortest dimension of a rectangular bale, based on the relative length of its sides.
        validation_guidance: >
          - Must be a decimal number between 13.0 and 250.0.
          - Units are defined by `bale_dimension_units`.
          - Applies only to bales with `small_rectangular` or `large_rectangular` shape.
          - Typical height values for small bales range from 14 to 18 inches (36 to 46 cm); large bales may be taller.
          - For round bales, this field should be left blank or omitted.
        numeric_id: 84
      - id: bale_dimension_length
        title: Bale Dimension Length
        data_type: float
        section: packaging
        required: false
        valid_range:
          min: 20
          max: 190
        narration: >
          For rectangular bales, length is defined as the longest of the three dimensions. This standardization ensures consistency across records and enables accurate calculation of
          volume, pallet configuration, and transport requirements.
        definition: >
          Specifies the longest dimension of a rectangular bale, based on the relative length of its sides.
        validation_guidance: >
          - Must be a decimal number between 20.0 and 190.0.
          - Units are defined by `bale_dimension_units`.
          - Applies only to bales with `small_rectangular` or `large_rectangular` shape.
          - Typical length values are 36 to 42 inches (91 to 107 cm) for small bales and up to 96 inches (244 cm) for large bales.
          - For round bales, this field should be left blank or omitted.
        numeric_id: 85
      - id: bale_dimension_diameter
        title: Bale Dimension Diameter
        data_type: float
        section: packaging
        required: false
        valid_range:
          min: 13
          max: 250
        narration: >
          Diameter is a key measurement for round bales, affecting storage space, wrapping requirements, and equipment compatibility. This value, combined with axis length, can also be
          used to estimate volume.
        definition: >
          Specifies the diameter of a round bale, measured across its circular face.
        validation_guidance: >
          - Must be a decimal number between 13.0 and 250.0.
          - Units are defined by `bale_dimension_units`.
          - Applies only to bales with `bale_shape` of `round`.
          - Typical round bale diameters range from 48 to 72 inches (122 to 183 cm).
          - For rectangular bales, this field should be left blank or omitted.
        numeric_id: 86
      - id: bale_dimension_axis
        title: Bale Dimension Axis
        data_type: float
        section: packaging
        required: false
        valid_range:
          min: 20
          max: 190
        narration: >
          The axis is the lengthwise measurement of a round bale and, together with diameter, defines its full dimensions. This measurement is important for modeling storage density,
          wrapping needs, and fitting bales into transport systems.
        definition: >
          Specifies the axis of a round bale, measured from flat face to flat face.
        validation_guidance: >
          - Must be a decimal number between 20.0 and 190.0.
          - Units are defined by `bale_dimension_units`.
          - Applies only to bales with `bale_shape` of `round`.
          - Typical round bale axis lengths range from 60 to 72 inches (152 to 183 cm).
          - For rectangular bales, this field should be left blank or omitted.
        numeric_id: 87
      - id: bale_dimension_units
        title: Bale Dimension Units
        data_type: enum
        section: packaging
        required: false
        required_if:
          any_populated:
            - bale_dimension_width
            - bale_dimension_height
            - bale_dimension_length
            - bale_dimension_diameter
            - bale_dimension_axis
          operator: value_present
          value: true
        enum_select_mode: single
        valid_values:
          - "`inches`"
          - "`centimeters`"
          - "`feet`"
          - "`meters`"
        narration: >
          - Valid values: `inches`, `centimeters`, `feet`, `meters`.
          - Applies to all dimension fields including `bale_dimension_width`, `bale_dimension_height`, `bale_dimension_length`, `bale_dimension_diameter`, and `bale_dimension_axis`.
          - Select a consistent unit for all bale dimensions within each record.
          - Typical value ranges provided in other fields are expressed in both inches and centimeters; interpretation depends on the selected unit.
          - If using `feet` or `meters`, ensure that recorded values reflect proper conversions from standard reference ranges.
        definition: >
          Specifies the unit of measure used for all bale dimension fields:
          bale_dimension_width, bale_dimension_height, bale_dimension_length, bale_dimension_diameter, and bale_dimension_axis.
        validation_guidance: >
          - Required if any `bale_dimension_*` fields are populated.
          - Valid values: `inches`, `centimeters`.
          - Applies to all dimension fields including `bale_dimension_width`, `bale_dimension_height`, `bale_dimension_length`, `bale_dimension_diameter`, and `bale_dimension_axis`.
          - Select a consistent unit for all bale dimensions within each record.
          - Typical value ranges provided in other fields are expressed in both inches and centimeters; interpretation depends on the selected unit.
        numeric_id: 88

  - id: traceability
    title: Traceability
    data_type: section
    required: true
    narration: >
      This section captures whether the hay can be traced to a clearly defined production lot and whether formal identifiers exist that facilitate lot-level tracking, recall, or
      certification.

      Traceability is increasingly important in high-value or regulated markets, as it supports inventory segregation, quality assurance, documentation of origin, and post-sale issue
      resolution. It enables sellers to demonstrate chain of custody, buyers to verify source conditions, and all parties to manage logistics and compliance more effectively.
    definition: >
      Defines how the hay can be traced back to its origin, including internal and external lot identifiers and optional field-to-bale mapping. Supports logistical transparency,
      documentation, and regulatory compliance.
    numeric_id: 89
    fields:
      - id: hay_single_lot_traceable
        title: Hay Single Lot Traceable
        data_type: boolean
        section: traceability
        required: true
        narration: >
          A lot is defined as forage taken from the same farm, field, and cut, harvested and stored under uniform conditions within a 48-hour period, as described in Ball et al. (2001).
          This designation supports clarity in nutritional representation, quality assessment, and logistical consistency. Where hay is mixed across cuts, fields, or harvest conditions,
          the value should be `false`.
        definition: >
          Affirms whether the hay being described originates from a single, defined lot, harvested under uniform agronomic and environmental conditions.
        validation_guidance: >
          - Valid values: `true`, `false`.
          - Use `true` only if all bales included in the described unit meet the lot definition without exception.
        numeric_id: 90
      - id: lot_identifier_internal
        title: Lot Identifier Internal
        data_type: string
        section: traceability
        required: false
        narration: >
          The internal identifier may reflect farm, field, cutting, or date conventions relevant to the seller's operation. It does not need to conform to any industry standard but
          should be unique within the seller's system.

          It may be used for inventory management, customer reference, and traceability across quality or testing modules.
        definition: >
          This field allows the seller to assign an internal identifier to the lot from which the hay originated.
        validation_guidance: >
          An internal identifier assigned by the producer or handler. Maximum length: 100 characters.
        numeric_id: 91
      - id: lot_identifier_external
        title: Lot Identifier External
        data_type: component
        section: traceability
        required: false
        narration: >
          This component captures an externally issued lot identifier and its issuing authority.
          - Component includes the following fields: `lot_identifier_external_value`, `lot_identifier_external_issuer`.
          - If `lot_identifier_external` is provided, both `lot_identifier_external_value` and `lot_identifier_external_issuer` must be completed.
          - Each value must be a string not exceeding 100 characters.
        definition: >
          A structured identifier used to associate the hay lot with an external tracking or documentation system.
        validation_guidance: >
          - All component fields must be completed if this component is present.
          - Each field must contain a string no longer than 100 characters.
          - Values should be issued by a recognized organization, such as a cooperative, exporter, certifying agency, or regulatory body.
        numeric_id: 92
        components:
          - id: lot_identifier_external_value
            title: Lot Identifier External Value
            data_type: string
            section: traceability
            parent_id: lot_identifier_external
            required: false
            narration: >
              External lot identifiers may appear on documents such as:

              - Organic certificates (e.g., USDA NOP Lot #12345)
              - Phytosanitary inspection reports
              - Export documents or permits
              - Weed-free forage program tags or declarations

              The value may include letters, numbers, or a combination thereof. Systems should preserve the identifier exactly as provided by the issuing body, including any dashes,
              slashes, or formatting symbols.

              This field enhances traceability and may support validation workflows, especially in regulated or export-focused markets.
            definition: >
              This field records the externally issued lot identifier assigned to the hay or forage lot by a regulatory, certifying, or export authority.
            validation_guidance: >
              Free-text field. Maximum length: 100 characters. Preserve formatting as issued.
            numeric_id: 93
          - id: lot_identifier_external_issuer
            title: Lot Identifier External Issuer
            data_type: string
            section: traceability
            parent_id: lot_identifier_external
            required: false
            required_if:
              field: lot_identifier_external
              operator: value_present
              value: true
            narration: >
              This field specifies the certifying or regulatory body that assigned the external lot identifier. Examples may include government agencies (e.g., USDA, CFIA), organic
              certification bodies, weed-free forage programs, or export compliance authorities.

              Referencing an external list ensures consistency across systems while allowing flexibility for less common or custom issuers. Structured issuer data improves traceability and
              supports document integration and validation workflows.
            definition: >
              Identifies the organization or program that issued the external lot identifier used to track the hay lot.
            validation_guidance: >
              - Required if `lot_identifier_external` is populated.
              - Must match an entry from the reference list of external lot identifier issuers.
              - Contact the publisher for the current list of accepted issuers.
              - Maximum length: 100 characters.
            numeric_id: 94
      - id: lot_mapping_field_to_bale_supported
        title: Lot Mapping Field To Bale Supported
        data_type: boolean
        section: traceability
        required: false
        narration: >
          This field affirms whether bale-level traceability is supported -- such as mapping individual bales to GPS coordinates, yield zones, harvest blocks, or storage groupings.

          Field-to-bale mapping allows for more precise tracking of forage origin, quality gradients, and logistical handling. This capability enhances transparency, supports premium
          markets, and may enable integration with field data platforms or precision agriculture systems.
        definition: >
          Indicates whether the seller maintains a system (digital or physical) for mapping specific bales or sub-lots to field-level characteristics.
        validation_guidance: >
          Valid values: true, false
        numeric_id: 95

  - id: physical_characteristics
    title: Physical Characteristics and Condition
    data_type: section
    required: true
    narration: >
      This section captures the visible, tactile, and olfactory traits of the hay, as well as relevant effects from post-harvest weather exposure and storage-related degradation.

      These characteristics help buyers assess product condition, identify potential quality risks, and determine suitability for specific uses or animal classes.
    definition: >
      Records visual and physical observations of the hay at the time of sale or inspection, including texture, color, odor, presence of contaminants, and general condition.
    numeric_id: 96
    groups:
      - id: weather_exposure
        fields:
          - id: weather_damage_windrow_rain
            title: Weather Damage Windrow Rain
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Exposure to rain in the windrow can increase surface moisture, delay curing, and reduce forage quality through leaching and microbial activity.
            definition: >
              Indicates whether the hay was rained on while in the windrow.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if rain occurred after cutting and before baling.
            numeric_id: 98
          - id: weather_damage_windrow_snow
            title: Weather Damage Windrow Snow
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Snowfall on windrowed hay may cause freezing, delay drying, and contribute to uneven curing or mold risk.
            definition: >
              Indicates whether the hay was exposed to snow in the windrow.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if snow fell on the hay while in the windrow stage.
            numeric_id: 99
          - id: weather_damage_windrow_sleet
            title: Weather Damage Windrow Sleet
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Sleet can introduce moisture and freeze-thaw conditions, leading to stem bruising, prolonged drying, or nutrient loss.
            definition: >
              Indicates whether the hay experienced sleet while in the windrow.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if sleet occurred before baling, while the hay was windrowed.
            numeric_id: 100
          - id: weather_damage_windrow_hail
            title: Weather Damage Windrow Hail
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Hail may physically damage hay in the windrow, causing leaf shatter, bruising, and reduced forage value.
            definition: >
              Indicates whether the hay experienced hail in the windrow.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if hail fell on hay after cutting and before baling.
            numeric_id: 101
          - id: weather_damage_windrow_fog
            title: Weather Damage Windrow Fog
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Persistent fog can slow drying and promote mold development by contributing to prolonged surface moisture.
            definition: >
              Indicates whether the hay was exposed to fog in the windrow.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if fog conditions delayed curing during the windrow stage.
            numeric_id: 102
          - id: weather_damage_windrow_dewfall
            title: Weather Damage Windrow Dewfall
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Heavy dewfall may prolong drying or cause leaf stickiness, affecting baling decisions and potential nutrient loss.
            definition: >
              Indicates whether the hay experienced dewfall in the windrow.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if dew was significant enough to affect windrow drying behavior.
            numeric_id: 103
          - id: weather_damage_windrow_assessment
            title: Weather Damage Windrow Assessment
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`none`"
              - "`minor`"
              - "`modest`"
              - "`substantial`"
              - "`unknown`"
            narration: >
              Summarizes the degree of weather impact observed while the hay was in the windrow stage. This field provides an overall impression based on field observations or records.
            definition: >
              Optional comment on the type or extent of windrow weather damage.
            validation_guidance: >
              - Valid values: `none`, `light`, `moderate`, `severe`, `unknown`.
              - Choose the level that best reflects the overall impact of weather events during the windrow period.
            numeric_id: 104
          - id: weather_damage_baled_rain
            title: Weather Damage Baled Rain
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Rain falling on baled hay can lead to rewetting, mold growth, heating, or spoilage -- especially in uncovered storage conditions.
            definition: >
              Indicates whether the hay was rained on after baling.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if the bales were rained on after baling.
            numeric_id: 105
          - id: weather_damage_baled_snow
            title: Weather Damage Baled Snow
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Snow on baled hay can contribute to moisture buildup and degradation if it melts or freezes repeatedly before storage.
            definition: >
              Indicates whether the hay was exposed to snow after baling.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if snow fell on hay after baling and before covered storage.
            numeric_id: 106
          - id: weather_damage_baled_sleet
            title: Weather Damage Baled Sleet
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Sleet on bales may introduce external moisture or ice, especially on field-cured or uncovered stacks.
            definition: >
              Indicates whether the hay experienced sleet after baling.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if sleet affected bales after harvest.
            numeric_id: 107
          - id: weather_damage_baled_hail
            title: Weather Damage Baled Hail
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Hail can damage bales by puncturing wrap or exposing inner material to weather, especially during storage or transit.
            definition: >
              Indicates whether the hay experienced hail after baling.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if hail impacted bales post-baling.
            numeric_id: 108
          - id: weather_damage_baled_moisture
            title: Weather Damage Baled Moisture
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              This field captures whether surface or internal moisture was observed on bales at the time of inspection, regardless of weather source.
            definition: >
              Indicates whether bales show signs of moisture exposure post-baling.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if moisture was evident on the bale surface or within during storage or transport.
            numeric_id: 109
          - id: weather_damage_baled_assessment
            title: Weather Damage Baled Assessment
            data_type: enum
            section: physical_characteristics
            group: weather_exposure
            required: true
            enum_select_mode: single
            valid_values:
              - "`none`"
              - "`minor`"
              - "`modest`"
              - "`substantial`"
              - "`unknown`"
            narration: >
              Summarizes the extent of weather-related damage observed after baling. May reflect discoloration, mold, softened texture, or visible deterioration.
            definition: >
              Optional comment on the type or extent of post-baling weather damage.
            validation_guidance: >
              - Valid values: `none`, `light`, `moderate`, `severe`, `unknown`.
              - Choose the level that best describes the overall condition of bales as affected by weather post-harvest.
            numeric_id: 110
      - id: visual_and_sensory
        fields:
          - id: hay_leafiness
            title: Hay Leafiness
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: false
            enum_select_mode: single
            valid_values:
              - "`very_leafy`"
              - "`leafy`"
              - "`slightly_stemmy`"
              - "`stemmy`"
            narration: >
              Leafiness is a strong indicator of forage quality, especially in legumes.
            definition: >
              Indicates the degree of leaf retention and presence relative to stems.
            validation_guidance: >
              - Valid values: `very_leafy`, `leafy`, `slightly_stemmy`, `stemmy`.
              - Select the value that best describes the observed proportion of leaves to stems in the hay.
              - Leafier hay is generally preferred for higher-quality forage, particularly in legumes.
            numeric_id: 112
          - id: hay_texture
            title: Hay Texture
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: false
            enum_select_mode: single
            valid_values:
              - "`very_soft_and_pliable`"
              - "`soft`"
              - "`slightly_harsh`"
              - "`harsh_or_brittle`"
            narration: >
              Texture affects intake, palatability, and suitability for different species.
            definition: >
              Describes the perceived texture or coarseness of the hay.
            validation_guidance: >
              - Valid values: `very_soft_and_pliable`, `soft`, `slightly_harsh`, `harsh_or_brittle`.
              - Choose the descriptor that best reflects the tactile feel of the hay when handled.
              - Softer textures are typically associated with higher palatability and digestibility.
            numeric_id: 113
          - id: hay_color
            title: Hay Color
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: false
            enum_select_mode: single
            valid_values:
              - "`natural_green_color_of_crop`"
              - "`light_green`"
              - "`yellow_to_slightly_brownish`"
              - "`brown_or_black`"
            narration: >
              Color indicates curing quality, storage conditions, and freshness.
            definition: >
              Describes the dominant color of the hay at time of sale.
            validation_guidance: >
              - Valid values: `natural_green_color_of_crop`, `light_green`, `yellow_to_slightly_brownish`, `brown_or_black`.
              - Select the color that most closely matches the overall appearance of the hay.
              - Greener color usually reflects better preservation and nutrient retention; darker colors may suggest weathering or microbial degradation.
            numeric_id: 114
          - id: organoleptic_factor_odor
            title: Organoleptic Factor Odor
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: false
            enum_select_mode: single
            valid_values:
              - "`clean_crop_smell`"
              - "`dusty`"
              - "`moldy`"
              - "`somewhat_sour`"
              - "`sour`"
              - "`rotten_or_otherwise_foul`"
            narration: >
              Odor can indicate freshness, spoilage, or fermentation.
            definition: >
              Describes the odor of the hay.
            validation_guidance: >
              - Valid values: `clean_crop_smell`, `dusty`, `moldy`, `somewhat_sour`, `sour`, `rotten_or_otherwise_foul`.
              - Select the odor description that most closely matches the dominant smell of the hay at inspection.
              - Clean crop smell is desirable; other odors may indicate spoilage, contamination, or improper storage.
            numeric_id: 115
          - id: organoleptic_factor_moldy
            title: Organoleptic Factor Moldy
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Visible mold affects feed safety, palatability, and marketability.
            definition: >
              Indicates visible mold presence.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if mold is visible or clearly detectable by smell or texture.
              - Use `false` only when mold is confidently absent.
              - Use `unknown` if mold presence cannot be determined.
            numeric_id: 116
          - id: organoleptic_factor_dusty
            title: Organoleptic Factor Dusty
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Dust may affect respiratory health in animals and handlers.
            definition: >
              Indicates the presence of airborne dust during handling.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if dust is visible during handling or noted by smell.
              - Use `false` only if the hay appears clean and dust-free.
              - Use `unknown` if dustiness cannot be assessed.
            numeric_id: 117
          - id: organoleptic_factor_rot
            title: Organoleptic Factor Rot
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Rot affects feed quality, safety, and odor.
            definition: >
              Indicates signs of decomposition or rot in the hay.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if any portion of the hay shows signs of rot, decay, or putrefaction.
              - Use `false` only if the hay is free of rot.
              - Use `unknown` if rot cannot be determined.
            numeric_id: 118
          - id: foreign_material_weeds
            title: Foreign Material Weeds
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Weeds may affect quality, palatability, or weed-seed transport risk.
            definition: >
              Indicates the presence of weed material in the hay.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if the hay contains non-crop weed material, such as broadleaf plants or grasses not intended for harvest.
              - Use `false` if no weeds are observed.
              - Use `unknown` if the presence of weeds cannot be confirmed.
            numeric_id: 119
          - id: foreign_material_burs
            title: Foreign Material Burs
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Burs may injure animals or reduce palatability.
            definition: >
              Indicates the presence of burrs, thorns, or spiny material.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if burs or barbed plant materials are found in the hay.
              - Use `false` if no burs are observed.
              - Use `unknown` if this cannot be determined with certainty.
            numeric_id: 120
          - id: foreign_material_insects
            title: Foreign Material Insects
            data_type: enum
            section: physical_characteristics
            group: visual_and_sensory
            required: true
            enum_select_mode: single
            valid_values:
              - "`true`"
              - "`false`"
              - "`unknown`"
            narration: >
              Insect presence may signal contamination or poor storage.
            definition: >
              Indicates visible insects or insect residues in the hay.
            validation_guidance: >
              - Valid values: `true`, `false`, `unknown`.
              - Select `true` if insects, insect parts, or visible signs of insect infestation are present.
              - Use `false` if the hay is free of insects or evidence of infestation.
              - Use `unknown` if the presence of insects cannot be assessed.
            numeric_id: 121
      - id: storage_handling
        fields:
          - id: handling_sequence
            title: Handling Sequence
            data_type: "object[]"
            section: physical_characteristics
            group: storage_handling
            required: true
            narration: >
              #NAME?
            definition: >
              #NAME?
            validation_guidance: >
              - Must be a list of structured entries representing the handling and storage sequence from baling to delivery.
              - Each entry may include the following fields: `location_type`, `duration_estimate`, `storage_structure`, `surface_type`, `airflow_condition`, `restacked`, and `exposure_risk`.
              - Values should reflect what is known or reasonably inferred about each handling stage.
              - Unknown or estimated values are acceptable if clearly disclosed.
              - The list may contain up to 5 entries.
              - The list may be empty if no handling history is available.
            cross_field_consistency: >
              - If `handling_sequence` is provided, it must include exactly one entry with `stage_label` = `final`.
              - If multiple entries have `stage_label` = `final`, validation should fail.
              - If `handling_sequence` is empty, this must reflect a true lack of known handling history. In such cases, no final storage information will be available.
              - The first entry, if known, should be labeled `initial`.
              - The last entry, if present, must be labeled `final`.
              - Any `intermediate` entries should reflect actual handling order between initial and final stages. If sequencing is uncertain, maintain logical best-effort order.
            numeric_id: 123
            components:
              - id: stage_label
                title: Stage Label
                data_type: enum
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: true
                enum_select_mode: single
                valid_values:
                  - "`initial`"
                  - "`intermediate`"
                  - "`final`"
                narration: >
                  - Labels each handling stage as the initial, intermediate, or final part of the hay's journey from field to buyer.
                  - The final stage represents where the hay is currently stored or was last observed before delivery.
                definition: >
                  - Specifies the role or position of this stage within the overall post-baling handling sequence.
                  - Used to identify the final known storage location as well as earlier stages in the hay's movement history.
                validation_guidance: >
                  Must be selected from the list of allowed values
                  Each entry in the handling_sequence must have a stage_label
                  At least one entry must be labeled final
                  There should be only one final entry per sequence
                numeric_id: 124
              - id: location_type
                title: Location Type
                data_type: enum
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: true
                enum_select_mode: single
                valid_values:
                  - "`on-farm`"
                  - "`co-op`"
                  - "`broker yard`"
                  - "`merchant warehouse`"
                  - "`export staging`"
                  - "`final delivery`"
                  - "`other`"
                narration: >
                  Helps identify where this handling or storage stage occurred.
                  The type of location offers clues about infrastructure, control over conditions, and the overall reliability of the storage environment.
                definition: >
                  Describes the type of site at which the hay was stored or handled during a specific stage.
                  Used to infer operational scale, infrastructure, and traceability expectations.
                validation_guidance: >
                  Must be selected from the list of allowed values
                  Describes the location type for this stage in the handling sequence
                numeric_id: 125
              - id: duration_estimate
                title: Estimated Duration
                data_type: string
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: false
                narration: >
                  Gives an approximate idea of how long the hay remained at this stage.
                  Longer durations may increase exposure risks or help explain nutrient changes between harvest and delivery.
                definition: >
                  A free-text estimate of how long the hay remained at this location.
                  Common formats include "2 weeks", "10-15 days", or "< 1 month".
                  May be unknown or approximate.
                validation_guidance: >
                  Must be a single string not exceeding 100 characters
                  Should describe the estimated duration of stay in human-readable terms
                  May be approximate or unknown
                numeric_id: 126
              - id: storage_structure
                title: Storage Structure
                data_type: enum
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: true
                enum_select_mode: single
                valid_values:
                  - "`barn_enclosed`"
                  - "`barn_open_sided`"
                  - "`tarp_covered_stack`"
                  - "`shed_roof_only`"
                  - "`open_air_uncovered`"
                  - "`containerized`"
                  - "`unknown`"
                  - "`other`"
                narration: >
                  Describes the kind of shelter or structure used to store hay during this handling stage.
                  Different structures affect drying, exposure risk, and long-term quality.
                definition: >
                  Describes the primary structural protection provided during storage at this handling stage.
                  Used to infer exposure to sun, wind, and precipitation at intermediate locations.
                validation_guidance: >
                  Must be selected from the list of allowed values
                  Describes the structural covering or protection used at this handling stage
                  Use unknown if the storage type is not documented or observed
                numeric_id: 127
              - id: surface_type
                title: Surface Type
                data_type: enum
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: true
                enum_select_mode: single
                valid_values:
                  - "`bare_soil`"
                  - "`concrete`"
                  - "`gravel`"
                  - "`pallets`"
                  - "`plastic_sheeting`"
                  - "`vegetation`"
                  - "`wood`"
                  - "`other`"
                  - "`unknown`"
                narration: >
                  Shows what the hay was stored on -- such as pallets or bare ground -- during this handling stage.
                  Used to assess potential moisture exposure, contamination, and contact-related damage.
                definition: >
                  Describes the surface material beneath the hay during storage.
                  Used to estimate moisture risk from ground contact and potential contamination.
                validation_guidance: >
                  Must be selected from the list of allowed values
                  Describes the surface on which bales were stacked or stored during this stage
                numeric_id: 128
              - id: airflow_condition
                title: Airflow Condition
                data_type: enum
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: true
                enum_select_mode: single
                valid_values:
                  - "`natural ventilation`"
                  - "`forced ventilation`"
                  - "`limited airflow`"
                  - "`sealed enclosure`"
                  - "`unknown`"
                narration: >
                  Explains how well air moved around the hay at this location.
                  Ventilation affects mold risk, moisture loss, and overall preservation quality.
                definition: >
                  Describes the airflow environment around the hay during storage.
                  Used to estimate spoilage risk, moisture retention, and ventilation quality.
                validation_guidance: >
                  Must be selected from the list of allowed values
                  Describes the type and adequacy of ventilation at the storage location
                numeric_id: 129
              - id: restacked
                title: Restacked at This Stage
                data_type: boolean
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: false
                narration: >
                  Indicates whether the hay was moved and re-stacked at this stage.
                  Restacking often leads to leaf loss or compaction, which can reduce quality.
                definition: >
                  Indicates whether the hay was restacked at this location or prior to this stage.
                  Restacking increases handling losses and may alter bale integrity.
                validation_guidance: >
                  Must be true or false
                  Indicates whether bales were restacked during this stage of handling
                numeric_id: 130
              - id: storage_degradation_visible
                title: Visible Storage Degradation
                data_type: enum
                section: physical_characteristics
                group: storage_handling
                parent_id: handling_sequence
                required: true
                enum_select_mode: multiple
                valid_values:
                  - "`superficial_sun_bleaching`"
                  - "`bottom_bale_damage_minor`"
                  - "`bottom_bale_damage_significant`"
                  - "`color_decline_minor`"
                  - "`color_decline_significant`"
                  - "`other`"
                narration: >
                  Specifies the types of damage or quality decline observed during this storage stage
                  Helps buyers assess whether any handling-related degradation is superficial or materially significant
                definition: >
                  Identifies visible signs of storage-related degradation that occurred during this handling stage
                  Captures physical effects such as bleaching, bottom bale spoilage, or noticeable color loss due to poor storage conditions
                validation_guidance: >
                  Must be selected from the list of allowed values
                  Multiple values may be selected if more than one type of degradation is visible or likely
                  Leave blank if no damage is evident or the hay was not inspected at this stage
                numeric_id: 131
    fields:
