  - id: intended_use
    title: Intended Use and Market Context
    data_type: section
    required: true
    narration: >
      This section captures the grower's intended livestock audience, production philosophy including any certifications, and other contextual factors relevant to how the hay is
      positioned in the market.

      These fields help buyers assess suitability for their specific animals, comply with regulatory or programmatic requirements such as organic certification or weed-free sourcing,
      and identify potential constraints such as restrictions on the import of genetically modified organisms.
    definition: >
      Captures the grower's or seller's intended market, buyer type, and end-use application for the hay. This section helps position the product within market contexts and buyer
      expectations.
    numeric_id: 206
    fields:
      - id: intended_forage_use
        title: Intended Forage Use
        data_type: enum
        section: intended_use
        required: false
        enum_select_mode: multiple
        valid_values:
          - "`dairy`"
          - "`beef`"
          - "`horse`"
          - "`goat`"
          - "`sheep`"
          - "`deer`"
          - "`camel`"
          - "`rabbit`"
          - "`guinea_pig`"
          - "`tortoise`"
          - "`zoo_or_wildlife`"
          - "`landscape`"
          - "`other`"
        narration: >
          - `dairy`  High-energy, high-protein, low-fiber forage suitable for lactating dairy cows.
          - `beef`  For growing, breeding, or finishing beef cattle with varied quality tolerance.
          - `horse`  Typically dust-free, low NSC forage with consistent texture and color.
          - `goat`  Moderate- to high-protein forage, tolerates stemmier material.
          - `sheep`  Requires attention to copper and energy levels; typically higher quality than beef forage.
          - `deer`  Highly digestible forage for farmed or captive cervids.
          - `camel`  Includes llamas, alpacas, and camels; suitable for coarser forage.
          - `rabbit`  High-fiber, low-calcium forage; typically small-stem grass hay.
          - `guinea_pig`  Similar to rabbit requirements; may need stricter control on mold and texture.
          - `tortoise`  Drier, low-protein hays (e.g., timothy or orchardgrass).
          - `zoo_or_wildlife`  Regulated or specialized forage for zoological or rescue settings.
          - `landscape`  Erosion control, bedding, weed suppression, or decorative mulch.
        definition: >
          Identifies the primary intended animal class or application for which the hay or forage is marketed.
        validation_guidance: >
          - Valid values: `dairy`, `beef`, `horse`, `goat`, `sheep`, `deer`, `camel`, `rabbit`, `guinea_pig`, `tortoise`, `zoo_or_wildlife`, `landscape`, `other`.
          - Allow multiple selections if hay is marketed toward more than one class.
        numeric_id: 207
      - id: intended_use_case
        title: Intended Use Case
        data_type: enum
        section: intended_use
        required: false
        enum_select_mode: single
        valid_values:
          - "`maintenance`"
          - "`growth`"
          - "`lactation`"
          - "`work`"
          - "`general_purpose`"
          - "`unknown`"
        narration: >
          This metadata helps buyers evaluate whether the hay aligns with their nutritional goals and may inform expected quality ranges.
          - `maintenance`  Intended for animals not in production (e.g., dry cows, idle horses).
          - `growth`  Designed to support young or growing animals.
          - `lactation`  Targeted for milk-producing animals with high energy/protein demand.
          - `work`  For animals performing physical labor (e.g., working horses).
          - `general_purpose`  No specific function; applicable to various use cases.
          - `unknown`  Intention not known or not disclosed.
        definition: >
          Captures the functional purpose for which the hay was intended, such as maintaining body condition, supporting growth, or producing milk.
        validation_guidance: >
          Valid values: `maintenance`, `growth`, `lactation`, `work`, `general_purpose`, `unknown`.
        numeric_id: 208
      - id: gmo_presence_status
        title: Gmo Presence Status
        data_type: enum
        section: intended_use
        required: true
        enum_select_mode: single
        valid_values:
          - "`gmo`"
          - "`non-gmo_certified`"
          - "`non-gmo_uncertified`"
          - "`unknown`"
        narration: >
          This field is important for export, specialty feed, and organic markets, where GMO crops may be restricted or excluded by regulation or buyer preference.
          - `gmo`  Hay was produced from a genetically modified crop (e.g., Roundup Ready alfalfa).
          - `non-gmo_certified`  Hay was produced from a non-GMO crop and has been certified by a recognized non-GMO verification program.
          - `non-gmo_uncertified`  The producer affirms that the hay is non-GMO but without formal certification.
          - `unknown`  GMO status of the source crop is not known or not disclosed.
        definition: >
          Describes whether the hay was produced from a genetically modified crop and whether any non-GMO designation is formally certified.
        validation_guidance: >
          - Valid values: `gmo`, `non-gmo_certified`, `non-gmo_uncertified`, `unknown`.
          - Accepted certification programs include Non-GMO Project Verified, USDA Organic (which prohibits GMOs), Certified Naturally Grown (if GMO-free attestation is included), and EU
          Organic Certification (Regulation (EU) 2018/848).
          - Notable regulatory contexts include:
          - European Union  Requires GMO labeling above 0.9% content for feed products.
          - Mexico  Imposes GMO corn restrictions with broader trade implications.
          - Selecting `unknown` affirms that GMO status is not known or not disclosed. This value should be used explicitly rather than omitting the field, to ensure transparency and
          regulatory compliance.
        numeric_id: 209
      - id: production_certification_status
        title: Production Certification Status
        data_type: enum
        section: intended_use
        required: true
        enum_select_mode: multiple
        valid_values:
          - "`certified_organic`"
          - "`certified_non_gmo`"
          - "`certified_weed_free`"
          - "`transitional_ organic`"
          - "`none`"
          - "`unknown`"
        narration: >
          This field may influence eligibility for specific markets or regulatory programs.
          - `certified_organic`  Certified under a recognized organic program (e.g., USDA NOP, EU Organic).
          - `certified_non-gmo`  Certified free of genetically modified organisms.
          - `certified_weed_free`  Certified noxious weed-free, often required for public land use or export.
          - `transitional_organic`  Produced using organic-compliant methods but not yet fully certified.
          - `none`  No applicable production-related certifications.
          - `unknown`  Certification status is not known or not disclosed.
        definition: >
          Captures the production-related certifications or designations that apply to the hay. These certifications provide assurance to buyers about how the hay was grown and handled.
        validation_guidance: >
          - Valid values: `certified_organic`, `certified_non-gmo`, `certified_weed_free`, `transitional_organic`, `none`, `unknown`.
          - Multiple values may be selected if more than one certification applies.
          - Use `none` if the producer affirms that no certifications apply.
          - Use `unknown` if certification status is not disclosed or not yet confirmed.
        numeric_id: 210
      - id: distribution_channel
        title: Distribution Channel
        data_type: enum
        section: intended_use
        required: true
        enum_select_mode: single
        valid_values:
          - "`local`"
          - "`regional`"
          - "`national`"
          - "`export`"
          - "`unknown`"
        narration: >
          This field may indicate associated quality expectations, packaging format, and logistical considerations.
          - `local`  Intended for use within the immediate community or county.
          - `regional`  Distributed across a multi-county or state/province area.
          - `national`  Distributed across the entire country.
          - `export`  Intended for international sale or shipping.
          - `unknown`  Not disclosed or not applicable.

          This information may support regulatory compliance, freight planning, and market segmentation analysis.
        definition: >
          Captures the primary distribution context or market scope for which the hay was prepared.
        validation_guidance: >
          - Valid values: `local`, `regional`, `national`, `export`, `unknown`.
          - Choose the value that best reflects the primary target distribution region.
          - Use `unknown` if the intended distribution region is not known or not disclosed.
        numeric_id: 211
      - id: export_eligibility_documentation
        title: Export Eligibility Documentation
        data_type: enum
        section: intended_use
        required: true
        enum_select_mode: multiple
        valid_values:
          - "`phytosanitary_certificate`"
          - "`fumigation_certificate`"
          - "`certificate_of_origin`"
          - "`weed_free_declaration`"
          - "`none`"
          - "`unknown`"
        narration: >
          This field supports international trade, reduces the risk of shipment rejection, and helps buyers comply with destination country requirements.
          - `phytosanitary_certificate` - Verifies the hay is free from regulated pests and meets the import requirements of the destination country.
          - `fumigation_certificate` - Confirms the hay has been treated with a fumigant prior to shipment.
          - `certificate_of_origin` - States the country of production, often required for trade preference or regulatory compliance.
          - `weed_free_declaration` - Indicates certification of noxious weed-free status under applicable standards.
          - `none` - No export documentation is provided with this hay.
          - `unknown` - The documentation status is not known or not disclosed.
        definition: >
          Identifies the export-related documentation available for the hay. Such documentation may be required to comply with quarantine laws, invasive species controls, or import
          regulations.
        validation_guidance: >
          - Valid values: `phytosanitary_certificate`, `fumigation_certificate`, `certificate_of_origin`, `weed_free_declaration`, `none`, `unknown`.
          - Allow multiple selections to reflect all relevant documentation.
        numeric_id: 212

  - id: metadata
    title: Metadata
    data_type: section
    required: true
    narration: >
      This final section consolidates supporting material related to authorship, licensing, documentation history, contact information, and reference sources. It is intended for
      readers who seek attribution details, wish to contribute to the standard, or need context regarding its provenance and maintenance.
    definition: >
      Structural and publication-related metadata for this version of the hay specification, including contributors, licensing, and references.
    numeric_id: 213
    fields:
      - id: version
        title: Specification Version
        data_type: string
        section: metadata
        required: true
        narration: >
          This field records the current release version of the specification using semantic versioning. The version number helps users distinguish between breaking changes (major),
          feature additions (minor), and minor corrections or documentation updates (patch).

          Maintaining clear version identifiers supports changelog management, automated validation workflows, and reproducibility in systems that rely on structured hay data.
        definition: >
          Indicates the formal version identifier of this specification release, following semantic versioning.
        validation_guidance: >
          Must follow a major.minor.patch format (e.g., 1.0.0, 0.90.0).
        numeric_id: 214
      - id: date_published
        title: Date Published
        data_type: date
        section: metadata
        required: true
        narration: >
          This field marks when the current version of the hay specification was formally published or released. It enables users to identify the timeliness of the version in use and
          supports traceability for historical reference, compliance, and validation.

          The publication date should reflect when the specification was finalized for public or internal adoption.
        definition: >
          Records the official publication date of this specification version.
        validation_guidance: >
          - Must be formatted as `YYYYMMDD`.
          - A full date is required.
          - Partial or unknown values are not permitted for this field.
          - Must be a valid ISO 8601 date.
        numeric_id: 215
      - id: contributors
        title: Contributors
        data_type: "string[]"
        section: metadata
        required: false
        narration: >
          This field credits the people and entities who authored, reviewed, or materially shaped the specification. Contributor entries may include individuals, working groups,
          institutions, or collaborating organizations.

          Providing clear attribution supports transparency, fosters community recognition, and enables users to contact subject-matter experts or participants for clarification,
          support, or future collaboration.
        definition: >
          Lists the individuals or organizations who contributed substantively to the development of this specification version.
        validation_guidance: >
          - Must be a list of free-text strings.
          - Each entry may include a name, affiliation, or contact reference.
          - Each string must not exceed 250 characters.
          - List may be empty if no contributors are specified.
        numeric_id: 216
      - id: license
        title: License
        data_type: string
        section: metadata
        required: true
        enum_select_mode: single
        narration: >
          This field defines the legal terms governing reuse, modification, and redistribution of the specification content. A clear license promotes transparency, facilitates community
          adoption, and ensures alignment with institutional or legal requirements.

          Common options for open data and documentation include Creative Commons (CC), Open Data Commons (ODC), and MIT-style licenses for technical assets.
        definition: >
          Specifies the license under which this specification is released.
        validation_guidance: >
          - Free-text field.
          - Recommended format includes license name and version (e.g., CC BY 4.0, ODC-BY 1.0, MIT).
        numeric_id: 217
      - id: references
        title: References
        data_type: "string[]"
        section: metadata
        required: false
        narration: >
          This field documents the foundational materials used to develop the specification, such as academic publications, government guidelines, laboratory protocols, or prior industry
          standards.

          Including references supports transparency, traceability, and credibility -- while also helping users understand the underlying rationale for specific field definitions or
          methodologies.
        definition: >
          Provides a list of source documents, technical references, or external standards that informed this specification.
        validation_guidance: >
          - Must be a list of free-text strings.
          - Each entry may include a title, organization, publication year, or URL.
          - Each string must not exceed 250 characters.
          - List may be empty if no references are cited.
        numeric_id: 218
      - id: schema_uri
        title: Schema URI
        data_type: string
        section: metadata
        required: false
        narration: >
          This field offers a canonical reference to the machine-readable schema for this specification version. It supports integration into automated workflows, validation tooling, and
          downstream systems that depend on structured hay data.
        definition: >
          Provides a resolvable URL or URI where the structured schema (e.g., JSON, YAML) for this specification version can be accessed.
        validation_guidance: >
          Must be a valid URI (e.g., https://example.org/specs/hay/v0.90.0/schema.yaml).
        numeric_id: 219
      - id: release_notes
        title: Release Notes
        data_type: string
        section: metadata
        required: false
        narration: >
          This field provides a human-readable changelog entry describing what has been updated since the previous version. It may highlight new fields, structural changes,
          clarifications, or fixes.

          Release notes help users understand the evolution of the specification and assess compatibility or migration needs.
        definition: >
          Summarizes key changes, additions, or corrections introduced in this version of the specification.
        validation_guidance: >
          Free-text field. Recommended maximum length: 500 characters.
        numeric_id: 220
      - id: spec_name
        title: Specification Name
        data_type: string
        section: metadata
        required: true
        narration: >
          This field provides a human-readable identifier for the specification, such as "Hay Description Specification" or "Lode Hay Spec v0.x." It may be used in citations,
          documentation headers, web pages, and other public references to the schema.

          Clear naming improves discoverability, supports versioning, and helps distinguish this specification from adjacent standards or technical models.
        definition: >
          Specifies the official name or short title of this specification.
        validation_guidance: >
          Free-text field. Recommended maximum length: 100 characters.
        numeric_id: 221
